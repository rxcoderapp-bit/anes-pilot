/* AnesPilot - Clinical Design System */

:root {
  --bg-primary: #05070a;
  --bg-secondary: #0d121c;
  --bg-card: #121926;
  --bg-card-hover: #192335;
  --border-subtle: #1e293b;
  --border-accent: #334155;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-cyan: #06b6d4;
  --accent-emerald: #10b981;
  --accent-amber: #f59e0b;
  --accent-rose: #ef4444;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
}

/* Base resets & typography */
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: text !important;
  -webkit-user-select: text !important;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.2s ease, color 0.2s ease;
}

/* UI Controls prevent accidental drag-selection */
.nav-tab, button, .glove-btn, .preset-btn, input[type="range"], select {
  user-select: none !important;
  -webkit-user-select: none !important;
}

/* Content Text Highlighting Style */
::selection {
  background-color: rgba(6, 182, 212, 0.4);
  color: inherit;
}

body.theme-light ::selection {
  background-color: #bae6fd;
  color: #0f172a;
}

/* Custom Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg-primary);
}
::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 4px;
}

/* App Container */
.app-container {
  max-width: 920px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header & Nav Bars in Default Dark */
.app-header {
  background-color: rgba(7, 11, 18, 0.95);
  border-color: rgba(30, 41, 59, 0.8);
}

.desktop-tabs-bar {
  background-color: #0a0f18;
  border-color: #1e293b;
}

.mobile-bottom-nav {
  background-color: rgba(7, 11, 18, 0.95);
  border-color: #1e293b;
}

/* Header & Quick Profile Bar */
.profile-pill {
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  border-radius: 100px;
}

/* Glove-friendly large controls */
.glove-btn {
  min-height: 44px;
  padding: 10px 16px;
  font-weight: 600;
  font-size: 0.92rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: var(--radius-md);
  transition: all 0.15s ease-in-out;
  cursor: pointer;
  touch-action: manipulation;
}

.glove-btn:active {
  transform: scale(0.97);
}

.glove-input {
  min-height: 44px;
  font-size: 1.05rem;
  font-weight: 600;
  border-radius: var(--radius-md);
  background: var(--bg-card);
  border: 1.5px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 8px 14px;
  outline: none;
  transition: border-color 0.2s ease, background-color 0.2s ease;
}

.glove-input:focus {
  border-color: var(--accent-cyan);
}

/* Slider customized for surgery gloves */
input[type="range"].glove-slider {
  -webkit-appearance: none;
  height: 10px;
  background: #1e293b;
  border-radius: 8px;
  outline: none;
}

input[type="range"].glove-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #38bdf8;
  border: 3px solid #0369a1;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
  cursor: pointer;
  transition: transform 0.1s ease;
}

input[type="range"].glove-slider::-webkit-slider-thumb:active {
  transform: scale(1.2);
}

/* Crisis Mode Pulse & Background Alert */
@keyframes alertFlash {
  0% { background-color: rgba(239, 68, 68, 0.08); }
  50% { background-color: rgba(239, 68, 68, 0.22); }
  100% { background-color: rgba(239, 68, 68, 0.08); }
}

.crisis-active-mode {
  animation: alertFlash 1.8s infinite ease-in-out;
  border-color: rgba(239, 68, 68, 0.6) !important;
}

/* Metronome Heart Pulse */
@keyframes heartBeatAnim {
  0% { transform: scale(1); }
  15% { transform: scale(1.25); }
  30% { transform: scale(1); }
  45% { transform: scale(1.15); }
  60% { transform: scale(1); }
}

.metronome-pulse {
  animation: heartBeatAnim 0.545s infinite ease-in-out;
  color: #f43f5e;
}

/**
 * AnesPilot - Cloud Sync & Google Auth Service
 * Powered by Google Firebase (v10 Modular SDK)
 * Supports Offline-First data synchronization across phones, tablets, and PCs.
 */

// Default Firebase Configuration for AnesPilot
const DEFAULT_FIREBASE_CONFIG = {
  apiKey: "AIzaSyCfqiHXlkg8LL9MUf9uEZYCP_jaXLQl8jc",
  authDomain: "anes-pilot.firebaseapp.com",
  projectId: "anes-pilot",

class CloudSyncService {
  constructor() {
    this.app = null;
    this.auth = null;
    this.db = null;
    this.currentUser = null;
    this.syncStatus = "offline"; // 'offline', 'connected', 'syncing', 'error'
    this.authListeners = [];
    this.syncListeners = [];
    this.lastSyncTime = localStorage.getItem("anes_last_sync_time") || null;
  }

  getConfig() {
    try {
      const custom = localStorage.getItem("anes_firebase_config");
      if (custom) return JSON.parse(custom);
    } catch (e) {}
    return DEFAULT_FIREBASE_CONFIG;
  }

  saveConfig(config) {
    localStorage.setItem("anes_firebase_config", JSON.stringify(config));
    // Re-initialize
    this.app = null;
    this.auth = null;
    this.db = null;
    return this.init();
  }

  async init() {
    try {
      if (!navigator.onLine) {
        this.setSyncStatus("offline");
        return false;
      }

      // Dynamically load Firebase modules to preserve 100% offline capability
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
      const { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
      const { getFirestore, doc, getDoc, setDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");

      this.firebaseModules = {
        GoogleAuthProvider,
        signInWithPopup,
        signOut,
        doc,
        getDoc,
        setDoc,
        serverTimestamp
      };

      const config = this.getConfig();
      this.app = initializeApp(config);
      this.auth = getAuth(this.app);
      this.db = getFirestore(this.app);

      onAuthStateChanged(this.auth, async (user) => {
        this.currentUser = user;
        if (user) {
          this.setSyncStatus("connected");
          this.notifyAuthListeners(user);
          // Auto sync on login
          await this.pullAndMerge();
        } else {
          this.setSyncStatus("offline");
          this.notifyAuthListeners(null);
        }
      });

      return true;
    } catch (err) {
      console.warn("[CloudSync] Firebase initialization in local mode:", err);
      this.setSyncStatus("offline");
      return false;
    }
  }

  async loginWithGoogle() {
    if (!this.auth) {
      const initialized = await this.init();
      if (!initialized || !this.auth) {
        throw new Error("請先設定您的 Firebase 金鑰（或確認網路已連線）。");
      }
    }

    const { GoogleAuthProvider, signInWithPopup } = this.firebaseModules;
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    try {
      this.setSyncStatus("syncing");
      const result = await signInWithPopup(this.auth, provider);
      this.currentUser = result.user;
      this.setSyncStatus("connected");
      this.notifyAuthListeners(this.currentUser);
      await this.pullAndMerge();
      return result.user;
    } catch (error) {
      this.setSyncStatus("error");
      console.error("Google Login Error:", error);
      throw error;
    }
  }

  async logout() {
    if (this.auth && this.firebaseModules?.signOut) {
      await this.firebaseModules.signOut(this.auth);
    }
    this.currentUser = null;
    this.setSyncStatus("offline");
    this.notifyAuthListeners(null);
  }

  async pullAndMerge() {
    if (!this.currentUser || !this.db) return null;

    try {
      this.setSyncStatus("syncing");
      const { doc, getDoc, setDoc } = this.firebaseModules;
      const userRef = doc(this.db, "users", this.currentUser.uid);
      const snapshot = await getDoc(userRef);

      let localCases = JSON.parse(localStorage.getItem("anes_cases") || "[]");
      let localDrugs = JSON.parse(localStorage.getItem("anes_custom_infusion_drugs") || "{}");

      if (snapshot.exists()) {
        const cloudData = snapshot.data();
        const cloudCases = cloudData.cases || [];
        const cloudDrugs = cloudData.customDrugs || {};

        // Smart merge cases by ID
        const caseMap = new Map();
        cloudCases.forEach(c => caseMap.set(c.id, c));
        localCases.forEach(c => caseMap.set(c.id, c)); // Local overrides/merges
        const mergedCases = Array.from(caseMap.values()).sort((a, b) => (b.id || 0) - (a.id || 0));

        // Smart merge custom drugs
        const mergedDrugs = { ...cloudDrugs, ...localDrugs };

        localStorage.setItem("anes_cases", JSON.stringify(mergedCases));
        localStorage.setItem("anes_custom_infusion_drugs", JSON.stringify(mergedDrugs));

        // Push unified state back to cloud
        await setDoc(userRef, {
          email: this.currentUser.email,
          displayName: this.currentUser.displayName,
          photoURL: this.currentUser.photoURL,
          cases: mergedCases,
          customDrugs: mergedDrugs,
          lastSyncAt: new Date().toISOString()
        }, { merge: true });

        this.lastSyncTime = new Date().toLocaleTimeString();
        localStorage.setItem("anes_last_sync_time", this.lastSyncTime);
        this.setSyncStatus("connected");

        return { cases: mergedCases, customDrugs: mergedDrugs };
      } else {
        // First time cloud sync: push all local data to cloud
        await setDoc(userRef, {
          email: this.currentUser.email,
          displayName: this.currentUser.displayName,
          photoURL: this.currentUser.photoURL,
          cases: localCases,
          customDrugs: localDrugs,
          lastSyncAt: new Date().toISOString()
        });

        this.lastSyncTime = new Date().toLocaleTimeString();
        localStorage.setItem("anes_last_sync_time", this.lastSyncTime);
        this.setSyncStatus("connected");
        return { cases: localCases, customDrugs: localDrugs };
      }
    } catch (e) {
      console.error("[CloudSync] Pull and merge error:", e);
      this.setSyncStatus("error");
      return null;
    }
  }

  async pushCases(cases) {
    if (!this.currentUser || !this.db) return;
    try {
      this.setSyncStatus("syncing");
      const { doc, setDoc } = this.firebaseModules;
      const userRef = doc(this.db, "users", this.currentUser.uid);
      await setDoc(userRef, {
        cases: cases,
        lastSyncAt: new Date().toISOString()
      }, { merge: true });

      this.lastSyncTime = new Date().toLocaleTimeString();
      localStorage.setItem("anes_last_sync_time", this.lastSyncTime);
      this.setSyncStatus("connected");
    } catch (e) {
      console.warn("[CloudSync] pushCases error:", e);
      this.setSyncStatus("error");
    }
  }

  async pushCustomDrugs(drugs) {
    if (!this.currentUser || !this.db) return;
    try {
      this.setSyncStatus("syncing");
      const { doc, setDoc } = this.firebaseModules;
      const userRef = doc(this.db, "users", this.currentUser.uid);
      await setDoc(userRef, {
        customDrugs: drugs,
        lastSyncAt: new Date().toISOString()
      }, { merge: true });

      this.lastSyncTime = new Date().toLocaleTimeString();
      localStorage.setItem("anes_last_sync_time", this.lastSyncTime);
      this.setSyncStatus("connected");
    } catch (e) {
      console.warn("[CloudSync] pushCustomDrugs error:", e);
      this.setSyncStatus("error");
    }
  }

  setSyncStatus(status) {
    this.syncStatus = status;
    this.syncListeners.forEach(fn => fn(status, this.lastSyncTime));
  }

  onAuthChange(callback) {
    this.authListeners.push(callback);
    if (this.currentUser) callback(this.currentUser);
  }

  onSyncChange(callback) {
    this.syncListeners.push(callback);
    callback(this.syncStatus, this.lastSyncTime);
  }

  notifyAuthListeners(user) {
    this.authListeners.forEach(fn => fn(user));
  }
}

      suctionFr = "8 - 10 Fr";
      lmaSize = "1.5 - 2 (10-20kg)";
    } else if (ageYears < 14.0) {
      // Pediatric 2 - 14 years
      // Motoyama & Khine formulas:
      const cuffedCalc = (ageYears / 4) + 3.5;
      const uncuffedCalc = (ageYears / 4) + 4.0;
      ettCuffed = Math.round(cuffedCalc * 2) / 2;
      ettUncuffed = Math.round(uncuffedCalc * 2) / 2;
      ettDepth = Math.round(((ageYears / 2) + 12) * 10) / 10;
      
      if (ageYears < 4) {
        bladeType = "Mac 2 / Miller 1.5";
      } else if (ageYears < 9) {
        bladeType = "Mac 2 - 3";
      } else {
        bladeType = "Mac 3";
      }
      suctionFr = "10 - 12 Fr";
      
      if (weightKg < 10) lmaSize = "1.5";
      else if (weightKg < 20) lmaSize = "2";
      else if (weightKg < 30) lmaSize = "2.5";
      else if (weightKg < 50) lmaSize = "3";
      else lmaSize = "4";
    } else {
      // Adult (>= 14 years)
      if (isFemale) {
        ettCuffed = 7.0;
        ettUncuffed = 7.0;
        ettDepth = 20.5;
        bladeType = "Mac 3";
        lmaSize = weightKg < 50 ? "3" : (weightKg < 70 ? "4" : "5");
      } else {
        ettCuffed = 7.5;
        ettUncuffed = 7.5;
        ettDepth = 22.5;
        bladeType = "Mac 3 - 4";
        lmaSize = weightKg < 70 ? "4" : "5";
      }
      suctionFr = "12 - 14 Fr";
    }

    return {
      ettCuffed,
      ettUncuffed,
      ettDepth,
      lmaSize,
      bladeType,
      suctionFr,
      reference: "Morgan & Mikhail's Clinical Anesthesiology (7e, Ch. 19 Airway Management)"
    };
  },

  // Calculate Ideal Body Weight (Pediatric: Traub & Kichen 1983 / Adult >=5ft: Devine / Adult <5ft: Devine deduction)
  calculateIBW(heightCm, isFemale, ageYears = null) {
    if (!heightCm || heightCm < 40) return null;
    const heightInches = heightCm / 2.54;
    const isChild = ageYears !== null ? ageYears < 18 : heightInches < 55;

    // Pediatric (< 18 years): Traub & Kichen (1983) validated pediatric formula
    // Matches CDC/WHO 50th percentile weight-for-height: IBW = 2.396 * e^(0.01863 * heightCm)
    if (isChild) {
      const ibwPed = 2.396 * Math.exp(0.01863 * heightCm);
      return Math.round(ibwPed * 10) / 10;
    }

    // Short stature adult (< 5ft / 152.4 cm): Devine linear back-projection (2.3 kg per inch below 60")
    if (heightInches < 60) {
      const inchesUnder5ft = 60 - heightInches;
      const base = isFemale ? 45.5 : 50.0;
      const ibwShort = base - (2.3 * inchesUnder5ft);
      return Math.round(Math.max(25, ibwShort) * 10) / 10;
    }

    // Adult (>= 5ft): Standard Devine Formula (Morgan & Mikhail's Appendix / ARDSNet)
    const inchesOver5ft = heightInches - 60;
    const ibw = isFemale ? 45.5 + 2.3 * inchesOver5ft : 50.0 + 2.3 * inchesOver5ft;
    return Math.round(ibw * 10) / 10;
  },

  // Calculate Maintenance Fluids (4-2-1 Rule / Holliday-Segar Method)
  calculateFluids(weightKg) {
    let hourlyRate = 0;
    if (weightKg <= 10) {
      hourlyRate = weightKg * 4;
    } else if (weightKg <= 20) {
      hourlyRate = 40 + (weightKg - 10) * 2;
    } else {
      hourlyRate = 60 + (weightKg - 20) * 1;
    }
    return {
      hourlyRate: Math.round(hourlyRate),
      npo8hr: Math.round(hourlyRate * 8),
      bolus20ml: Math.round(weightKg * 20),
      reference: "Morgan & Mikhail's Ch. 49 (Fluid Management & Transfusion)"
    };
  },

  // Calculate Estimated Blood Volume (EBV) & MABL (Furman Formula)
  calculateBlood(weightKg, ageYears, isFemale, startHct = 36, targetHct = 24) {
    let ebvFactor = 70; // mL/kg
    if (ageYears < 0.08) {
      ebvFactor = 85; // Neonate
    } else if (ageYears < 1) {
      ebvFactor = 80; // Infant
    } else if (ageYears < 12) {
      ebvFactor = 75; // Child
    } else {
      ebvFactor = isFemale ? 65 : 70; // Adult
    }

    const ebv = Math.round(weightKg * ebvFactor);
    const avgHct = (startHct + targetHct) / 2;
    const mabl = Math.max(0, Math.round(ebv * ((startHct - targetHct) / avgHct)));

    return { ebv, mabl, ebvFactor, reference: "Morgan & Mikhail's Ch. 49 & Goodman & Gilman Ch. 37" };
  },

/**
 * AnesPilot - Dosing Engine
 */


class DosingEngine {
  static calculateAll(params) {
    const { ageYears, weightKg, heightCm, isFemale } = params;

    const ibw = DRUG_DATABASE.calculateIBW(heightCm, isFemale, ageYears);
    const airway = DRUG_DATABASE.calculateAirway(ageYears, weightKg, isFemale);
    const fluids = DRUG_DATABASE.calculateFluids(weightKg);
    const blood = DRUG_DATABASE.calculateBlood(weightKg, ageYears, isFemale);
    const dosages = DRUG_DATABASE.getDosages(weightKg, ageYears, isFemale, ibw);

    // Calculate BSA (Mosteller formula)
    let bsa = null;
    if (heightCm && weightKg) {
      bsa = Math.round(Math.sqrt((heightCm * weightKg) / 3600) * 100) / 100;
    }

    // Ventilator recommendation: 6 - 8 mL/kg of IBW (or TBW if no height)
    const ventBaseWeight = (ibw && ibw > 0) ? ibw : weightKg;
    const tvLow = Math.round(ventBaseWeight * 6);
    const tvHigh = Math.round(ventBaseWeight * 8);

    return {
      weightKg,
      ageYears,
      isFemale,
      heightCm,
      ibw,
      bsa,
      airway,
      fluids,
      blood,
      dosages,
      ventilator: {
        tvLow,
        tvHigh,
        baseWeight: ventBaseWeight,
        isUsingIbw: Boolean(ibw)
      }
    };
  }
}

/**
 * AnesPilot - Crisis Engine
 * Checklist workflows, calculations (MH, LAST, CICO, Anaphylaxis, ACLS),
 * Audio-driven CPR metronome (110 bpm) and step timers using Web Audio API.
 */

class AudioService {
  constructor() {
    this.ctx = null;
    this.metronomeInterval = null;
    this.isMetronomeRunning = false;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume();
    }
  }

  beep(freq = 800, duration = 0.08, type = "sine") {
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {
      console.warn("Audio play blocked:", e);
    }
  }

  startMetronome(bpm = 110, onTick) {
    this.init();
    this.stopMetronome();
    this.isMetronomeRunning = true;
    const intervalMs = (60 / bpm) * 1000;
    let count = 0;

    this.metronomeInterval = setInterval(() => {
      count++;
      const isHigh = count % 2 === 1;
      this.beep(isHigh ? 950 : 750, 0.06, "square");
      if (onTick) onTick(count);
    }, intervalMs);
  }

  stopMetronome() {
    if (this.metronomeInterval) {
      clearInterval(this.metronomeInterval);
      this.metronomeInterval = null;
    }
    this.isMetronomeRunning = false;
  }

  alarm() {
    this.init();
    this.beep(880, 0.15, "triangle");
    setTimeout(() => this.beep(1100, 0.2, "triangle"), 160);
    setTimeout(() => this.beep(1320, 0.3, "triangle"), 380);
  }
}

class ToxicityEngine {
  static calculateToxicity(weightKg, administeredList, hasHighRiskFactors = false) {
    const riskFactor = hasHighRiskFactors ? 0.8 : 1.0; // 20% safety margin reduction for high-risk patients
    let totalFraction = 0;
    const breakdown = [];

    administeredList.forEach(item => {
      const agent = LA_AGENTS[item.agentId];
      if (!agent) return;

      const safeMaxMg = Math.min(agent.maxCeilingMg, agent.maxMgPerKg * weightKg) * riskFactor;
      // Calculate mg given:
      // item can have volumeMl and concPercent, or directly mg
      let mgGiven = item.mg;
      if (mgGiven == null || isNaN(mgGiven)) {
        const conc = item.concPercent || agent.defaultConcPercent;
        const mgPerMl = conc * 10;
        mgGiven = (item.volumeMl || 0) * mgPerMl;
      }

      const fraction = safeMaxMg > 0 ? (mgGiven / safeMaxMg) : 0;
      totalFraction += fraction;

      breakdown.push({
        agentId: item.agentId,
        name: agent.name,
        mgGiven: Math.round(mgGiven * 10) / 10,
        safeMaxMg: Math.round(safeMaxMg * 10) / 10,
        fractionPercent: Math.round(fraction * 1000) / 10,
        volumeMl: item.volumeMl
      });
    });

    const totalPercent = Math.round(totalFraction * 1000) / 10;
    const remainingFraction = Math.max(0, 1.0 - totalFraction);

    // Remaining capacity in commonly used agents:
    // 1) 1% Lidocaine plain (10 mg/mL)
    const lidoSafeMax = Math.min(LA_AGENTS.lidocaine_plain.maxCeilingMg, LA_AGENTS.lidocaine_plain.maxMgPerKg * weightKg) * riskFactor;
    const remainingLido1PercentMl = Math.max(0, Math.round((lidoSafeMax * remainingFraction) / 10 * 10) / 10);

    // 2) 0.2% Ropivacaine (2 mg/mL)
    const ropiSafeMax = Math.min(LA_AGENTS.ropivacaine.maxCeilingMg, LA_AGENTS.ropivacaine.maxMgPerKg * weightKg) * riskFactor;
    const remainingRopi02PercentMl = Math.max(0, Math.round((ropiSafeMax * remainingFraction) / 2 * 10) / 10);

    // 3) 0.5% Bupivacaine (5 mg/mL)
    const bupiSafeMax = Math.min(LA_AGENTS.bupivacaine_plain.maxCeilingMg, LA_AGENTS.bupivacaine_plain.maxMgPerKg * weightKg) * riskFactor;
    const remainingBupi05PercentMl = Math.max(0, Math.round((bupiSafeMax * remainingFraction) / 5 * 10) / 10);

    let status = "SAFE"; // SAFE (<70%), CAUTION (70-99%), TOXIC (>=100%)
    let statusClass = "text-emerald-400 border-emerald-500/30 bg-emerald-950/20";
    let statusText = "安全性良好 (劑量在安全許可範圍內)";

    if (totalPercent >= 100) {
      status = "TOXIC";
      statusClass = "text-rose-400 border-rose-500/50 bg-rose-950/30 animate-pulse";
      statusText = "🚨 毒性超標警戒！立即停止給藥，嚴密監測 LAST 症候！";
    } else if (totalPercent >= 70) {
      status = "CAUTION";
      statusClass = "text-amber-400 border-amber-500/40 bg-amber-950/30";
      statusText = "⚠️ 接近中毒上限警戒區 (≥ 70%)，建議減少或停止追加！";
    }

    return {
      totalPercent,
      remainingFraction,
      status,
      statusClass,
      statusText,
      breakdown,
      remainingCapacity: {
        lido1PercentMl: remainingLido1PercentMl,
        ropi02PercentMl: remainingRopi02PercentMl,
        bupi05PercentMl: remainingBupi05PercentMl
      }
    };
  }
}

class InfusionEngine {
  static getDrugs() {
    let custom = {};
    try {
      custom = JSON.parse(localStorage.getItem("anes_custom_infusion_drugs") || "{}");
    } catch (e) {
      console.warn("Failed to parse custom drugs:", e);
    }
    return { ...BASE_INFUSION_DRUGS, ...custom };
  }

  static saveCustomDrug(id, drugObj) {
    let custom = {};
    try {
      custom = JSON.parse(localStorage.getItem("anes_custom_infusion_drugs") || "{}");
    } catch (e) {}
    custom[id] = { ...drugObj, isCustom: true };
    localStorage.setItem("anes_custom_infusion_drugs", JSON.stringify(custom));
  }

  static deleteCustomDrug(id) {
    let custom = {};
    try {
      custom = JSON.parse(localStorage.getItem("anes_custom_infusion_drugs") || "{}");
      delete custom[id];
      localStorage.setItem("anes_custom_infusion_drugs", JSON.stringify(custom));
    } catch (e) {}
  }

  static doseToRate(drugId, presetIndex, targetDose, weightKg, customConcMcgMl = null) {
    const drugs = this.getDrugs();
    const drug = drugs[drugId] || BASE_INFUSION_DRUGS.norepinephrine;
    const conc = customConcMcgMl || drug.presets[presetIndex]?.concMcgMl || 1;

    let rateMlHr = 0;
    if (drug.unit === "mcg/kg/min") {
      rateMlHr = (targetDose * weightKg * 60) / conc;
    } else if (drug.unit === "mcg/kg/hr") {
      rateMlHr = (targetDose * weightKg) / conc;
    } else if (drug.unit === "mg/kg/hr") {
      const concMgMl = conc / 1000;
      rateMlHr = (targetDose * weightKg) / concMgMl;
    } else if (drug.unit === "mg/hr") {
      const concMgMl = conc / 1000;
      rateMlHr = targetDose / concMgMl;
    } else if (drug.unit === "Units/min") {
      // conc in Units/mL is concMcgMl / 1000
      const concUMl = conc / 1000;
      rateMlHr = (targetDose * 60) / concUMl;
    }

    return Math.round(rateMlHr * 100) / 100;
  }

  static rateToDose(drugId, presetIndex, rateMlHr, weightKg, customConcMcgMl = null) {
    const drugs = this.getDrugs();
    const drug = drugs[drugId] || BASE_INFUSION_DRUGS.norepinephrine;
    const conc = customConcMcgMl || drug.presets[presetIndex]?.concMcgMl || 1;

    let dose = 0;
    if (drug.unit === "mcg/kg/min") {
      dose = (rateMlHr * conc) / (weightKg * 60);
    } else if (drug.unit === "mcg/kg/hr") {
      dose = (rateMlHr * conc) / weightKg;
    } else if (drug.unit === "mg/kg/hr") {
      const concMgMl = conc / 1000;
      dose = (rateMlHr * concMgMl) / weightKg;
    } else if (drug.unit === "mg/hr") {
      const concMgMl = conc / 1000;
      dose = rateMlHr * concMgMl;
    } else if (drug.unit === "Units/min") {
      const concUMl = conc / 1000;
      dose = (rateMlHr * concUMl) / 60;
    }

    return Math.round(dose * 1000) / 1000;
  }
}

class ScoresEngine {
  // STOP-Bang for OSA
  static calculateStopBang(answers) {
    // answers is array of boolean [S, T, O, P, B, A, N, G]
    const score = answers.filter(Boolean).length;
    let riskLevel = "低度風險 (Low Risk)";
    let badgeClass = "text-emerald-400 border-emerald-500/30 bg-emerald-950/30";
    let recommendation = "常規呼吸道處置，術後依照標準監測。";

    if (score >= 5 || (score >= 3 && (answers[4] || answers[6] || answers[7]))) {
      riskLevel = "高度風險 (High Risk for OSA)";
      badgeClass = "text-rose-400 border-rose-500/50 bg-rose-950/40";
      recommendation = "🚨 術中易發生難以面罩通氣/插管！拔管需清醒且完全肌鬆逆轉，術後慎用高劑量類鴉片類藥物，強烈建議持續血氧監測或 CPAP。";
    } else if (score >= 3) {
      riskLevel = "中度風險 (Intermediate Risk)";
      badgeClass = "text-amber-400 border-amber-500/40 bg-amber-950/30";
      recommendation = "⚠️ 警惕睡眠呼吸中止症，備妥合適口咽導氣管與影像喉頭鏡。";
    }

    return { score, total: 8, riskLevel, badgeClass, recommendation };
  }

  // Apfel Score for Postoperative Nausea & Vomiting (PONV)
  static calculateApfel(female, nonSmoker, historyPonvOrMotion, postopOpioids) {
    const factors = [female, nonSmoker, historyPonvOrMotion, postopOpioids];
    const score = factors.filter(Boolean).length;

    const riskPercentages = [10, 21, 39, 61, 79];
    const riskPercent = riskPercentages[score];

    let strategy = "";
    let badgeClass = "text-emerald-400 border-emerald-500/30 bg-emerald-950/30";

    if (score === 0 || score === 1) {
      strategy = "低風險（~10-21%）：一般常規處置，無需預防性併用多種止吐劑，可視情況給予單一藥物 (如 Dexamethasone 4-8 mg)。";
    } else if (score === 2) {
      badgeClass = "text-amber-400 border-amber-500/40 bg-amber-950/30";
      strategy = "中度風險（~39%）：建議給予 2 種不同機轉之止吐藥（如誘導時 Dexamethasone 4-8 mg + 關傷口時 Ondansetron 4 mg 或 Granisetron 1 mg）。";
    } else {
      badgeClass = "text-rose-400 border-rose-500/50 bg-rose-950/40";
      strategy = "高度風險（~61-79%）：強烈建議採用多模式 PONV 預防組合：\n1. 優先考慮全靜脈麻醉 (TIVA with Propofol)，避免使用吸入性氣體與 N2O。\n2. 給予 2-3 種止吐劑 (Dexamethasone + 5-HT3 antagonist + Droperidol 0.625mg)。\n3. 考慮局部神經阻滯減少術後鴉片類藥物用量，充分給予靜脈輸液。";
    }

    return { score, riskPercent, strategy, badgeClass };
  }

  // Revised Cardiac Risk Index (RCRI / Lee's Criteria)
  static calculateRcri(criteria) {
    // 6 criteria:
    // 1. High-risk surgery (intraperitoneal, intrathoracic, suprainguinal vascular)
    // 2. History of ischemic heart disease (MI, angina, CABG/PCI)
    // 3. History of congestive heart failure
    // 4. History of cerebrovascular disease (TIA, stroke)
    // 5. Preoperative insulin therapy for diabetes
    // 6. Preoperative serum creatinine > 2.0 mg/dL (177 umol/L)
    const score = criteria.filter(Boolean).length;

    let cardiacEventRisk = "3.9% (Class I)";
    let badgeClass = "text-emerald-400 border-emerald-500/30 bg-emerald-950/30";
    let recommendation = "心血管併發症風險低，常規監測。";

    if (score === 1) {
      cardiacEventRisk = "6.0% (Class II)";
      badgeClass = "text-emerald-300 border-emerald-500/30 bg-emerald-950/30";
      recommendation = "輕度心血管風險，維持術中血壓平穩，避免心搏過速與低血壓。";
    } else if (score === 2) {
      cardiacEventRisk = "10.1% (Class III)";
      badgeClass = "text-amber-400 border-amber-500/40 bg-amber-950/30";
      recommendation = "⚠️ 中度心血管風險，術中建議建立動脈導管 (A-line) 即時血壓監測，備好升壓劑。";
    } else if (score >= 3) {
      cardiacEventRisk = "15.0% 以上 (Class IV)";
      badgeClass = "text-rose-400 border-rose-500/50 bg-rose-950/40";
      recommendation = "🚨 高度心血管風險！應詳細評估心臟功能（心電圖、心臟超音波 Echo），考慮進階血行動態監測 (A-line, FloTrac, TEE)，術後安排加護病房 (ICU) 照護。";
    }

    return { score, cardiacEventRisk, recommendation, badgeClass };
  }
}

function initCloudSyncListeners() {
  cloudSync.onAuthChange((user) => {
    const btnLogin = document.getElementById("btn-google-login");
    const userProfile = document.getElementById("google-user-profile");
    const avatar = document.getElementById("user-avatar");
    const nameEl = document.getElementById("user-display-name");

    if (user) {
      if (btnLogin) btnLogin.classList.add("hidden");
      if (userProfile) userProfile.classList.remove("hidden");
      if (avatar) avatar.src = user.photoURL || "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><circle cx='12' cy='8' r='4'/><path d='M4 20c0-4 4-6 8-6s8 2 8 6'/></svg>";
      if (nameEl) nameEl.textContent = user.displayName || user.email.split("@")[0];

      // Refresh cases from merged local storage
      state.cases = JSON.parse(localStorage.getItem("anes_cases") || "[]");
      if (state.activeTab === "logbook") renderLogbookTab();
    } else {
      if (btnLogin) btnLogin.classList.remove("hidden");
      if (userProfile) userProfile.classList.add("hidden");
      if (state.activeTab === "logbook") renderLogbookTab();
    }
  });

  cloudSync.onSyncChange((status, time) => {
    const syncStatusEl = document.getElementById("cloud-sync-status-badge");
    if (syncStatusEl) {
      if (status === "connected") {
        syncStatusEl.innerHTML = `<span class="text-emerald-400 font-bold">🟢 雲端已同步 (${time || '剛剛'})</span>`;
      } else if (status === "syncing") {
        syncStatusEl.innerHTML = `<span class="text-cyan-400 font-bold animate-pulse">🔄 同步傳輸中...</span>`;
      } else if (status === "error") {
        syncStatusEl.innerHTML = `<span class="text-amber-400 font-bold">⚠️ 同步待重試 (離線模式)</span>`;
      } else {
        syncStatusEl.innerHTML = `<span class="text-slate-400 font-bold">⚪ 本機離線模式 (LocalStorage)</span>`;
      }
    }
  });

  // Attempt non-blocking initialization
  cloudSync.init().catch(e => console.log("Offline mode active"));
}

function initEventListeners() {
  // Navigation Tabs
  document.querySelectorAll(".nav-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      const target = tab.dataset.tab;
      setActiveTab(target);
    });
  });

  // Emergency Red Button (Direct to Crisis)
  const btnEmergency = document.getElementById("btn-quick-crisis");
  if (btnEmergency) {
    btnEmergency.addEventListener("click", () => setActiveTab("crisis"));
  }

  // Theme Toggle
  const btnTheme = document.getElementById("btn-theme-toggle");
  if (btnTheme) {
    btnTheme.addEventListener("click", toggleTheme);
  }

  // Patient Parameter Controls
  const weightInput = document.getElementById("input-weight");
  const weightSlider = document.getElementById("slider-weight");
  const ageInput = document.getElementById("input-age");
  const heightInput = document.getElementById("input-height");
  const genderToggle = document.getElementById("btn-gender-toggle");

  if (weightInput && weightSlider) {
    const syncWeight = (val) => {
      const num = parseFloat(val) || 1;
      state.patient.weightKg = Math.max(1, Math.min(200, num));
      weightInput.value = state.patient.weightKg;
      weightSlider.value = state.patient.weightKg;
      renderAll();
    };
    weightInput.addEventListener("input", (e) => syncWeight(e.target.value));
    weightSlider.addEventListener("input", (e) => syncWeight(e.target.value));
  }

  if (ageInput) {
    ageInput.addEventListener("input", (e) => {
      const num = parseFloat(e.target.value) || 0;
      state.patient.ageYears = Math.max(0, Math.min(110, num));
      state.patient.isPediatric = state.patient.ageYears < 12;
      renderAll();
    });
  }

  if (heightInput) {
    heightInput.addEventListener("input", (e) => {
      const num = parseFloat(e.target.value) || 0;
      state.patient.heightCm = num;
      renderAll();
    });
  }

  if (genderToggle) {
    genderToggle.addEventListener("click", () => {
      state.patient.isFemale = !state.patient.isFemale;
      genderToggle.textContent = state.patient.isFemale ? "女性 ♀" : "男性 ♂";
      genderToggle.className = state.patient.isFemale 
        ? "glove-btn bg-pink-950/60 text-pink-300 border border-pink-700/50"
        : "glove-btn bg-sky-950/60 text-sky-300 border border-sky-700/50";
      renderAll();
    });
  }

  // IBW Badge Click Info (Pediatric Traub-Johnson vs Adult Devine & BMI)
  const ibwBadge = document.getElementById("profile-ibw-badge");
  if (ibwBadge) {
    ibwBadge.addEventListener("click", () => {
      const p = state.patient;
      const dosing = DosingEngine.calculateAll(p);
      if (!dosing.ibw) return;
      const hM = p.heightCm / 100;
      const bmi22 = (Math.round(22 * hM * hM * 10) / 10).toFixed(1);
      const isPed = p.ageYears < 18 || (p.heightCm / 2.54) < 60;

      if (isPed) {
        alert(
          `【小兒理想體重 (Pediatric IBW) 計算說明】\n\n` +
          `目前病患設定：${p.ageYears < 1 ? Math.round(p.ageYears * 12) + ' 個月大' : p.ageYears + ' 歲'}小兒，身高 ${p.heightCm} cm (${p.isFemale ? '女性' : '男性'})\n\n` +
          `★ Traub-Johnson 兒科權威公式【本系統採用】：${dosing.ibw} kg\n` +
          `   • 計算公式：(身高吋)² × 1.65 / 1000\n` +
          `   • 醫學依據：專為 1~17 歲或身高 < 152cm 之小兒設計，精準匹配 CDC/WHO 生長曲線第 50 百分位數標準體重。\n` +
          `   • 臨床重要性：小兒肥胖時之保護性通氣潮氣量 (6-8 mL/kg) 與親水性藥物劑量安全基準（修正了成人 Devine 公式 45.5kg 導致嚴重氣壓傷之致命風險）。\n\n` +
          `註：年滿 18 歲且身高 ≥ 152.4cm 則切換為成人 Devine 麻醉金標準公式。`
        );
      } else {
        const bmiGender = p.isFemale 
          ? (Math.round(21 * hM * hM * 10) / 10).toFixed(1)
          : (Math.round(22 * hM * hM * 10) / 10).toFixed(1);
        alert(
          `【成人理想體重 (IBW) 計算公式說明】\n\n` +
          `目前病患設定：成人 ${p.ageYears} 歲，身高 ${p.heightCm} cm (${p.isFemale ? '女性' : '男性'})\n\n` +
          `1. Devine 公式 (1974) 【本系統採用】：${dosing.ibw} kg\n` +
          `   • 醫學地位：國際麻醉醫學界唯一金標準（《Morgan & Mikhail》、《Miller》、ARDSNet）\n` +
          `   • 臨床用途：肌鬆劑 (Rocuronium/Cisatracurium) 與保護性潮氣量 (6-8 mL/kg) 唯一指定標準。\n\n` +
          `2. 衛福部/國健署 BMI 理想體重法：${bmi22} kg (男女分計: ${bmiGender} kg)\n` +
          `   • 計算公式：22 × 身高(m)²\n` +
          `   • 臨床用途：大眾健康管理、體態評估與營養代謝門診。\n\n` +
          `★ 麻醉藥物動力學與機械通氣設定，強烈建議依 Devine 公式以確保給藥安全！`
        );
      }
    });
  }

  // Quick Patient Presets
  document.querySelectorAll(".preset-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const w = parseFloat(btn.dataset.w);
      const a = parseFloat(btn.dataset.a);
      const h = parseFloat(btn.dataset.h);
      const f = btn.dataset.f === "true";

      state.patient.weightKg = w;
      state.patient.ageYears = a;
      state.patient.heightCm = h;
      state.patient.isFemale = f;
      state.patient.isPediatric = a < 12;

      // Sync inputs
      if (weightInput) weightInput.value = w;
      if (weightSlider) weightSlider.value = w;
      if (ageInput) ageInput.value = a;
      if (heightInput) heightInput.value = h;
      if (genderToggle) {
        genderToggle.textContent = f ? "女性 ♀" : "男性 ♂";
        genderToggle.className = f 
          ? "glove-btn bg-pink-950/60 text-pink-300 border border-pink-700/50"
          : "glove-btn bg-sky-950/60 text-sky-300 border border-sky-700/50";
      }

      renderAll();
    });
  });
}

// --- Navigation Management ---
function setActiveTab(tabId) {
  state.activeTab = tabId;
  document.querySelectorAll(".nav-tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.tab === tabId);
  });
  document.querySelectorAll(".tab-content").forEach(panel => {
    panel.classList.toggle("hidden", panel.id !== `panel-${tabId}`);
  });
  renderActiveTab();
}

// --- Theme Management ---
function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme(state.theme);
}

function applyTheme(theme) {
  const body = document.body;
  const icon = document.getElementById("theme-icon");
  if (theme === "light") {
    body.classList.add("theme-light");
    if (icon) icon.textContent = "☀️ 日照模式";
  } else {
    body.classList.remove("theme-light");
    if (icon) icon.textContent = "🌙 刀房暗室";
  }
}

function renderAll() {
  renderProfilePill();
  renderActiveTab();
}

function renderProfilePill() {
  const p = state.patient;
  const dosing = DosingEngine.calculateAll(p);
  const pillWeight = document.getElementById("profile-display-weight");
  const pillAge = document.getElementById("profile-display-age");
  const pillIbw = document.getElementById("profile-display-ibw");

  if (pillWeight) pillWeight.textContent = `${p.weightKg} kg`;
  if (pillAge) {
    if (p.ageYears < 1) {
      const months = Math.round(p.ageYears * 12);
      pillAge.textContent = `${months > 0 ? months : 1} 個月大 (嬰幼兒)`;
    } else {
      pillAge.textContent = `${p.ageYears} 歲 ${p.isPediatric ? '(小兒)' : '(成人)'}`;
    }
  }
  const ibwBadge = document.getElementById("profile-ibw-badge");
  if (pillIbw) {
    if (dosing.ibw) {
      const label = ibwBadge ? ibwBadge.querySelector("span:first-child") : null;
      if (label) label.textContent = "IBW:";
      pillIbw.textContent = `${dosing.ibw} kg`;
      if (ibwBadge) {
        ibwBadge.style.display = "flex";
        const isPed = p.ageYears < 18 || (p.heightCm / 2.54) < 60;
        if (isPed) {
          ibwBadge.title = `【小兒理想體重】\n• Traub-Johnson 兒科權威公式: ${dosing.ibw} kg (匹配 CDC/WHO 50th%)\n(點擊查看詳細公式說明)`;
        } else {
          const hM = p.heightCm / 100;
          const bmi22 = (Math.round(22 * hM * hM * 10) / 10).toFixed(1);
          ibwBadge.title = `【成人理想體重 IBW】\n• Devine 麻醉金標準: ${dosing.ibw} kg\n• 國健署 BMI(22)法: ${bmi22} kg\n(點擊查看詳細公式比較)`;
        }
      }
    } else {
      const label = ibwBadge ? ibwBadge.querySelector("span:first-child") : null;
      if (label) label.textContent = "BSA:";
      pillIbw.textContent = dosing.bsa ? `${dosing.bsa} m²` : '--';
      if (ibwBadge) {
        ibwBadge.title = "體表面積 BSA (Mosteller 公式)";
      }
    }
  }
}

function renderActiveTab() {

function renderDrugRow(drug, isEmergency = false) {
  const bgClass = isEmergency ? "bg-rose-950/20 border-rose-900/30" : "bg-slate-900/40 border-slate-800";

  const isExpanded = state.expandedDrugIds[drug.id] || false;

  return `
    <div class="p-3 rounded-lg border ${bgClass} transition cursor-pointer select-text" onclick="window.toggleDrugExpand('${drug.id}')">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 select-text">

          <div class="flex items-center gap-1.5 text-cyan-400 font-bold select-text">

          ${drug.pearls ? `<div class="text-amber-300 select-text"><span class="text-amber-400 font-semibold">臨床考點/注意事項 (Clinical Pearls)：</span>${drug.pearls}</div>` : ''}
        </div>

  `;
}

window.toggleDrugExpand = (drugId) => {
  const sel = window.getSelection();
  if (sel && sel.toString().trim().length > 0) {
    return;
  }
  state.expandedDrugIds[drugId] = !state.expandedDrugIds[drugId];
  renderDosingTab();
};

function renderCrisisTab() {
  const container = document.getElementById("crisis-container");
  if (!container) return;

  const crisisKeys = Object.keys(CRISIS_MODULES);
  const currentMod = CRISIS_MODULES[state.activeCrisisId] || CRISIS_MODULES.mh;
  const doses = currentMod.calculateDoses(state.patient.weightKg);

  container.innerHTML = `
    <!-- Top Crisis Selector Tabs -->
    <div class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-4">
      ${crisisKeys.map(k => {
        const mod = CRISIS_MODULES[k];
        const isActive = k === state.activeCrisisId;
        return `
          <button class="glove-btn text-xs py-2 px-1 text-center font-bold rounded-lg border transition-all ${
            isActive 
              ? 'bg-rose-700 text-white border-rose-500 shadow-lg shadow-rose-950/80'
              : 'bg-slate-900 text-slate-300 border-slate-800 hover:bg-slate-800'
          }" onclick="window.switchCrisis('${k}')">
            ${mod.title.split(' ')[0]}
          </button>
        `;
      }).join("")}

    <!-- Active Crisis Header Banner -->
    <div class="anes-card crisis-active-mode mb-4 border-2 border-rose-600 bg-rose-950/30">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-2xl">🚨</span>
            <h2 class="text-xl font-black text-rose-400 tracking-wide">${currentMod.title}</h2>
            <span class="drug-badge bg-rose-900 text-rose-200 border border-rose-700 font-black">${currentMod.badge}</span>
          </div>
          <p class="text-sm text-slate-300 mt-1">${currentMod.subtitle}</p>
        </div>

        <div class="flex items-center gap-2">
          ${state.activeCrisisId === 'acls' ? `
            <button id="btn-metronome" class="glove-btn bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm px-4 shadow-md" onclick="window.toggleMetronome()">
              <span id="metro-heart" class="text-lg">❤️</span>
              <span id="metro-text">開啟 CPR 110bpm 節拍器</span>
            </button>
          ` : `
            <button class="glove-btn bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs py-2" onclick="window.startCrisisTimer('${state.activeCrisisId}')">

      </div>

      <!-- Live Calculation Card for Current Crisis -->

      <div class="space-y-2">
        ${currentMod.actionSteps.map((step, idx) => `
          <label class="flex items-start gap-3 p-3 rounded-lg bg-slate-900/50 hover:bg-slate-900/80 border border-slate-800/80 cursor-pointer transition">
            <input type="checkbox" id="check-${step.id}" class="mt-1 w-5 h-5 rounded accent-rose-500 bg-slate-950 cursor-pointer">

}

window.switchCrisis = (id) => {
  state.activeCrisisId = id;
  renderCrisisTab();
};

window.resetChecklist = () => {
  document.querySelectorAll('#crisis-container input[type="checkbox"]').forEach(c => c.checked = false);
};

window.toggleMetronome = () => {
  const heart = document.getElementById("metro-heart");
  const text = document.getElementById("metro-text");
  const btn = document.getElementById("btn-metronome");

  if (audioService.isMetronomeRunning) {
    audioService.stopMetronome();
    if (heart) heart.classList.remove("metronome-pulse");
    if (text) text.textContent = "開啟 CPR 110bpm 節拍器";
    if (btn) btn.className = "glove-btn bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm px-4 shadow-md";
  } else {
    audioService.startMetronome(110);
    if (heart) heart.classList.add("metronome-pulse");
    if (text) text.textContent = "🔊 節拍器運作中 (點此關閉)";
    if (btn) btn.className = "glove-btn bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm px-4 shadow-md";
  }
};

window.startCrisisTimer = (id) => {
  audioService.alarm();
  alert("計時器已啟動！5 分鐘後將提醒您重新評估處置效果。");
};

        `).join("")}

}

  state.toxicityHighRisk = checked;
  renderToxicityTab();
};

window.removeToxItem = (idx) => {
  state.toxicityAdministered.splice(idx, 1);
  renderToxicityTab();
};

window.showAddToxModal = () => {
  const vol = prompt("請輸入施打劑量體積 (mL)，例如: 20", "20");
  if (!vol) return;
  const volNum = parseFloat(vol);
  if (isNaN(volNum) || volNum <= 0) return;

  const agentId = prompt("請選擇藥物序號 (1: 1% Lidocaine, 2: 1% Lido+Epi, 3: 0.2% Ropivacaine, 4: 0.5% Bupivacaine)", "3");
  let selectedAgent = "ropivacaine";
  let conc = 0.2;
  if (agentId === "1") { selectedAgent = "lidocaine_plain"; conc = 1.0; }
  else if (agentId === "2") { selectedAgent = "lidocaine_epi"; conc = 1.0; }
  else if (agentId === "4") { selectedAgent = "bupivacaine_plain"; conc = 0.5; }

  state.toxicityAdministered.push({
    id: Date.now(),
    agentId: selectedAgent,
    concPercent: conc,
    volumeMl: volNum,
    mg: volNum * conc * 10
  });

  renderToxicityTab();
};

window.showAddCustomDrugModal = () => {
  const name = prompt("請輸入自訂藥物名稱 (例如: Vasopressin 升壓 / precedex 稀釋液):");
  if (!name) return;

  const unit = prompt("給藥單位 (mcg/kg/min / mcg/kg/hr / mg/kg/hr / mg/hr / Units/min)", "mcg/kg/min");
  if (!unit) return;

  const concStr = prompt("稀釋後濃度 (mcg/mL，例如 4mg in 50mL 請輸入 80):", "80");
  const conc = parseFloat(concStr) || 80;

  const doseMinStr = prompt("最低建議劑量 (例如 0.01):", "0.01");
  const doseMaxStr = prompt("最高建議劑量 (例如 1.0):", "1.0");

  const customId = "custom_" + Date.now();
  const newDrug = {
    name: name,
    unit: unit,
    isWeightBased: unit.includes("/kg"),
    doseMin: parseFloat(doseMinStr) || 0.01,
    doseMax: parseFloat(doseMaxStr) || 1.0,
    reference: "使用者自訂醫院常規配置 (Hospital Custom Recipe)",
    pearls: "院內自訂輸注品項，儲存於手機/電腦本地瀏覽器",
    presets: [
      { label: `自訂配方 (${conc} mcg/mL)`, totalDrugMg: 1, totalVolMl: 50, concMcgMl: conc }
    ]
  };

  InfusionEngine.saveCustomDrug(customId, newDrug);
  cloudSync.pushCustomDrugs(InfusionEngine.getDrugs());
  state.infusionDrugId = customId;
  state.infusionPresetIdx = 0;
  state.infusionTargetDose = newDrug.doseMin;
  renderInfusionTab();
  alert("自訂藥物儲存成功！已同步至雲端與本機。");
};

window.deleteCurrentCustomDrug = (id) => {
  if (confirm("確定要刪除此自訂藥物品項嗎？")) {
    InfusionEngine.deleteCustomDrug(id);
    cloudSync.pushCustomDrugs(InfusionEngine.getDrugs());
    state.infusionDrugId = "norepinephrine";
    state.infusionPresetIdx = 0;
    renderInfusionTab();
  }
};

window.addCaseModal = () => {
  const proc = prompt("請輸入手術術式名稱 (例如: Laparoscopic Cholecystectomy)", "腹腔鏡膽囊切除術");
  if (!proc) return;

  const anesType = prompt("麻醉方式 (GA-ETT / GA-LMA / Spinal / Epidural / Nerve Block)", "GA-ETT");
  const lines = prompt("管路或特殊處置 (A-line, CVC, Ultrasound block)", "A-line, PNB");
  const note = prompt("備註 (非必填)", "順利");

  const newCase = {
    id: Date.now(),
    date: new Date().toLocaleDateString(),
    procedure: proc,
    anesType: anesType || "GA-ETT",
    weight: state.patient.weightKg,
    ettSize: state.patient.isPediatric ? "4.0" : (state.patient.isFemale ? "7.0" : "7.5"),
    lines: lines || "",
    isDifficultAirway: false,
    note: note || ""
  };

  state.cases.unshift(newCase);
  localStorage.setItem("anes_cases", JSON.stringify(state.cases));
  cloudSync.pushCases(state.cases);
  renderLogbookTab();
};

window.exportJsonBackup = () => {
  const data = {
    appName: "AnesPilot",
    exportDate: new Date().toISOString(),
    cases: state.cases,
    customDrugs: JSON.parse(localStorage.getItem("anes_custom_infusion_drugs") || "{}")
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `anes_pilot_backup_${dateStr}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

// Backup: Import JSON
window.importJsonBackup = (event) => {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.cases && Array.isArray(imported.cases)) {
        state.cases = imported.cases;
        localStorage.setItem("anes_cases", JSON.stringify(state.cases));
        cloudSync.pushCases(state.cases);
      }
      if (imported.customDrugs) {
        localStorage.setItem("anes_custom_infusion_drugs", JSON.stringify(imported.customDrugs));
        cloudSync.pushCustomDrugs(imported.customDrugs);
      }
      alert("✅ 備份檔匯入還原成功！");
      renderLogbookTab();
    } catch (err) {
      alert("❌ 備份檔解析失敗，請確認是否為正確的 JSON 備份檔。");
    }
  };
  reader.readAsText(file);
};

// Backup: Export CSV
window.exportCsvBackup = () => {
  if (state.cases.length === 0) {
    alert("目前尚無病例紀錄可供匯出。");
    return;
  }

  // BOM for Excel UTF-8
  let csv = "\uFEFF日期,術式名稱,麻醉方式,病患體重(kg),管徑(ETT),特殊處置,備註\n";
  state.cases.forEach(c => {
    const row = [
      `"${c.date}"`,
      `"${c.procedure}"`,
      `"${c.anesType}"`,
      `"${c.weight}"`,
      `"${c.ettSize}"`,
      `"${c.lines}"`,
      `"${c.note}"`
    ];
    csv += row.join(",") + "\n";
  });

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `anes_cases_${dateStr}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

function extractFirebaseConfig(input) {
  const text = input.trim();
  try {
    return JSON.parse(text);
  } catch (e) {}

  const fields = ["apiKey", "authDomain", "projectId", "storageBucket", "messagingSenderId", "appId"];
  const result = {};
  for (const field of fields) {
    const regex = new RegExp("['\"]?" + field + "['\"]?\\s*:\\s*['\"]([^'\"]+)['\"]");
    const match = text.match(regex);
    if (match) {
      result[field] = match[1];
    }
  }

  if (result.apiKey && result.projectId) {
    return result;
  }
  throw new Error("無法從內容中解析出 apiKey 與 projectId，請確認是否有複製完整的配置內容。");
}

window.showFirebaseConfigModal = () => {
  const currentConfig = cloudSync.getConfig();
  const currentStr = JSON.stringify(currentConfig, null, 2);
  const input = prompt(
    "【Firebase 專屬雲端金鑰設定】\n" +
    "請貼入您在 Firebase Console 建立的 Web 應用程式配置：\n" +
    "(支援直接貼入 const firebaseConfig = { ... } 或標準 JSON 格式；若清空送出則恢復為預設範本)",
    currentStr
  );
  if (input === null) return;
  try {
    if (!input.trim()) {
      localStorage.removeItem("anes_firebase_config");
      alert("已重設為系統預設 Firebase 範本設定。");
      cloudSync.init();
      renderLogbookTab();
      return;
    }
    const configObj = extractFirebaseConfig(input);
    cloudSync.saveConfig(configObj);
    alert(`✅ Firebase 專案 [${configObj.projectId}] 設定已儲存成功！正在連線...`);
    renderLogbookTab();
  } catch (e) {
    alert("❌ 設定解析失敗：\n" + e.message);
  }
};

  <script>
    if ('serviceWorker' in navigator) {

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=1.3.2')
          .then((reg) => {
            console.log('AnesPilot Offline Service Worker Ready (v1.3.2):', reg.scope);
            reg.update();
          })

      });
    }

    // 點擊版本號徽章可立即強制清除離線快取並重載
    document.addEventListener('DOMContentLoaded', () => {
      const badge = document.getElementById('app-version-badge');
      if (badge) {
        badge.style.cursor = 'pointer';
        badge.title = '點擊立即重整並清除離線快取';
        badge.addEventListener('click', async () => {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let reg of registrations) {
              await reg.unregister();
            }
          }
          window.location.reload(true);
        });
      }
    });
  </script>
