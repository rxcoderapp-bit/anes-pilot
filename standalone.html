/* AnesPilot - Clinical Design System */

:root {
  --bg-primary: #05070a;
  --bg-secondary: #0d121c;

  --text-muted: #64748b;

  --accent-emerald: #10b981;
  --accent-amber: #f59e0b;
  --accent-rose: #ef4444;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
}

body.theme-light {
  --bg-primary: #f8fafc;

/* Base resets & typography */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);

}
::-webkit-scrollbar-track {
  background: var(--bg-primary);
}
::-webkit-scrollbar-thumb {

/* App Container */
.app-container {

/* Header & Quick Profile Bar */

/* Glove-friendly large controls */
.glove-btn {

.glove-btn:active {

}

.glove-input {

  border-radius: var(--radius-md);
  background: var(--bg-card);
  border: 1.5px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 8px 14px;
  outline: none;
  transition: border-color 0.2s ease;
}

.glove-input:focus {
  border-color: var(--accent-cyan);
}

/* Slider customized for surgery gloves */
input[type="range"].glove-slider {
  -webkit-appearance: none;
  height: 10px;
  background: #1e293b;
  border-radius: 8px;
  outline: none;
}

input[type="range"].glove-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #38bdf8;
  border: 3px solid #0369a1;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
  cursor: pointer;
  transition: transform 0.1s ease;
}

input[type="range"].glove-slider::-webkit-slider-thumb:active {
  transform: scale(1.2);
}

/* Crisis Mode Pulse & Background Alert */
@keyframes alertFlash {
  0% { background-color: rgba(239, 68, 68, 0.08); }
  50% { background-color: rgba(239, 68, 68, 0.22); }
  100% { background-color: rgba(239, 68, 68, 0.08); }
}

.crisis-active-mode {
  animation: alertFlash 1.8s infinite ease-in-out;
  border-color: rgba(239, 68, 68, 0.6) !important;
}

/* Metronome Heart Pulse */
@keyframes heartBeatAnim {
  0% { transform: scale(1); }

  30% { transform: scale(1); }
  45% { transform: scale(1.15); }
  60% { transform: scale(1); }

  <script>
/**
 * AnesPilot - Clinical Drug Data & Formulas
 * Standardized across international and Taiwan anesthesia practices.
 */

const DRUG_DATABASE = {
  // Airway Calculations
  calculateAirway(ageYears, weightKg, isFemale = false) {
    let ettCuffed, ettUncuffed, ettDepth, lmaSize, bladeType, suctionFr;

    if (ageYears < 0.08) {
      // Premature / Neonate (< 1 month)
      if (weightKg < 1.0) {
        ettUncuffed = 2.5; ettCuffed = 2.5; ettDepth = 6.0; bladeType = "Miller 00"; suctionFr = "5 - 6 Fr"; lmaSize = "N/A (<2kg)";
      } else if (weightKg < 2.5) {
        ettUncuffed = 3.0; ettCuffed = 2.5; ettDepth = 7.0; bladeType = "Miller 0"; suctionFr = "6 Fr"; lmaSize = "N/A (<2kg)";
      } else {
        ettUncuffed = 3.5; ettCuffed = 3.0; ettDepth = 8.5 - 9.0; bladeType = "Miller 0 - 1"; suctionFr = "6 - 8 Fr"; lmaSize = "1 (<5kg)";
      }
    } else if (ageYears < 1.0) {
      // Infant (1 - 12 months)
      ettUncuffed = 3.5;
      ettCuffed = 3.0;
      ettDepth = Math.min(11, Math.round(((weightKg / 2) + 6) * 10) / 10);
      bladeType = "Miller 1";
      suctionFr = "8 Fr";
      lmaSize = weightKg < 5 ? "1 (<5kg)" : "1.5 (5-10kg)";
    } else if (ageYears < 2.0) {
      // 1 - 2 years
      ettUncuffed = 4.0;
      ettCuffed = 3.5;
      ettDepth = 11.5;
      bladeType = "Miller 1 - 1.5 / Mac 2";
      suctionFr = "8 - 10 Fr";
      lmaSize = "1.5 - 2 (10-20kg)";
    } else if (ageYears < 14.0) {
      // Pediatric 2 - 14 years
      // Motoyama & Khine formula:
      const cuffedCalc = (ageYears / 4) + 3.5;
      const uncuffedCalc = (ageYears / 4) + 4.0;
      ettCuffed = Math.round(cuffedCalc * 2) / 2;
      ettUncuffed = Math.round(uncuffedCalc * 2) / 2;
      ettDepth = Math.round(((ageYears / 2) + 12) * 10) / 10;
      
      if (ageYears < 4) {
        bladeType = "Mac 2 / Miller 1.5";
      } else if (ageYears < 9) {
        bladeType = "Mac 2 - 3";
      } else {
        bladeType = "Mac 3";
      }
      suctionFr = "10 - 12 Fr";
      
      if (weightKg < 10) lmaSize = "1.5";
      else if (weightKg < 20) lmaSize = "2";
      else if (weightKg < 30) lmaSize = "2.5";
      else if (weightKg < 50) lmaSize = "3";
      else lmaSize = "4";
    } else {
      // Adult (>= 14 years)
      if (isFemale) {
        ettCuffed = 7.0;
        ettUncuffed = 7.0;
        ettDepth = 20.5;
        bladeType = "Mac 3";
        lmaSize = weightKg < 50 ? "3" : (weightKg < 70 ? "4" : "5");
      } else {
        ettCuffed = 7.5;
        ettUncuffed = 7.5;
        ettDepth = 22.5;
        bladeType = "Mac 3 - 4";
        lmaSize = weightKg < 70 ? "4" : "5";
      }
      suctionFr = "12 - 14 Fr";
    }

    return {
      ettCuffed,
      ettUncuffed,
      ettDepth,
      lmaSize,
      bladeType,
      suctionFr
    };
  },

  // Calculate Ideal Body Weight (Devine Formula)
  calculateIBW(heightCm, isFemale) {
    if (!heightCm || heightCm < 60) return null;
    const heightInches = heightCm / 2.54;
    if (heightInches <= 60) {
      return isFemale ? 45.5 : 50.0;
    }
    const inchesOver5ft = heightInches - 60;
    const ibw = isFemale ? 45.5 + 2.3 * inchesOver5ft : 50.0 + 2.3 * inchesOver5ft;
    return Math.round(ibw * 10) / 10;
  },

  // Calculate Maintenance Fluids (4-2-1 Rule)
  calculateFluids(weightKg) {
    let hourlyRate = 0;
    if (weightKg <= 10) {
      hourlyRate = weightKg * 4;
    } else if (weightKg <= 20) {
      hourlyRate = 40 + (weightKg - 10) * 2;
    } else {
      hourlyRate = 60 + (weightKg - 20) * 1;
    }
    return {
      hourlyRate: Math.round(hourlyRate),
      npo8hr: Math.round(hourlyRate * 8),
      bolus20ml: Math.round(weightKg * 20)
    };
  },

  // Calculate Estimated Blood Volume (EBV) & MABL
  calculateBlood(weightKg, ageYears, isFemale, startHct = 36, targetHct = 24) {
    let ebvFactor = 70; // mL/kg
    if (ageYears < 0.08) {
      ebvFactor = 85; // Neonate
    } else if (ageYears < 1) {
      ebvFactor = 80; // Infant
    } else if (ageYears < 12) {
      ebvFactor = 75; // Child
    } else {
      ebvFactor = isFemale ? 65 : 70; // Adult
    }

    const ebv = Math.round(weightKg * ebvFactor);
    const avgHct = (startHct + targetHct) / 2;
    const mabl = Math.max(0, Math.round(ebv * ((startHct - targetHct) / avgHct)));

    return { ebv, mabl, ebvFactor };
  },

  // Detailed drug dosages
  getDosages(weightKg, ageYears, isFemale = false, ibw = null) {
    const w = weightKg;
    const activeIbw = (ibw && ibw > 0) ? ibw : w;
    const isPed = ageYears < 12;
    const isInfant = ageYears < 1;

    return {
      // 1. Induction & Muscle Relaxants
      induction: [
        {
          name: "Propofol (二異丙酚)",
          badge: "TBW",
          perKg: isPed ? "2.5 - 3.5 mg/kg" : "1.5 - 2.5 mg/kg",
          dose: isPed
            ? `${Math.round(w * 2.5)} - ${Math.round(w * 3.5)} mg`
            : `${Math.round(w * 1.5)} - ${Math.round(w * 2.5)} mg`,
          note: isPed ? "小兒分佈體積大，誘導劑量偏高" : "年長衰弱者建議降至 1.0 - 1.5 mg/kg"
        },
        {
          name: "Ketamine (氯胺酮)",
          badge: "TBW",
          perKg: "1.0 - 2.0 mg/kg IV (4-6 mg/kg IM)",
          dose: `${Math.round(w * 1.0)} - ${Math.round(w * 2.0)} mg IV`,
          note: "血行動態不穩、氣喘患者首選"
        },

/**
 * AnesPilot - Dosing Engine
 */


class DosingEngine {
  static calculateAll(params) {
    const { ageYears, weightKg, heightCm, isFemale } = params;

    const ibw = DRUG_DATABASE.calculateIBW(heightCm, isFemale);
    const airway = DRUG_DATABASE.calculateAirway(ageYears, weightKg, isFemale);
    const fluids = DRUG_DATABASE.calculateFluids(weightKg);
    const blood = DRUG_DATABASE.calculateBlood(weightKg, ageYears, isFemale);
    const dosages = DRUG_DATABASE.getDosages(weightKg, ageYears, isFemale, ibw);

    // Calculate BSA (Mosteller formula)
    let bsa = null;
    if (heightCm && weightKg) {
      bsa = Math.round(Math.sqrt((heightCm * weightKg) / 3600) * 100) / 100;
    }

    // Ventilator recommendation: 6 - 8 mL/kg of IBW (or TBW if no height)
    const ventBaseWeight = (ibw && ibw > 0) ? ibw : weightKg;
    const tvLow = Math.round(ventBaseWeight * 6);
    const tvHigh = Math.round(ventBaseWeight * 8);

    return {
      weightKg,
      ageYears,
      isFemale,
      heightCm,
      ibw,
      bsa,
      airway,
      fluids,
      blood,
      dosages,
      ventilator: {
        tvLow,
        tvHigh,
        baseWeight: ventBaseWeight,
        isUsingIbw: Boolean(ibw)
      }
    };
  }
}

/**
 * AnesPilot - Crisis Engine
 * Checklist workflows, calculations (MH, LAST, CICO, Anaphylaxis, ACLS),
 * Audio-driven CPR metronome (110 bpm) and step timers using Web Audio API.
 */

class AudioService {
  constructor() {
    this.ctx = null;
    this.metronomeInterval = null;
    this.isMetronomeRunning = false;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume();
    }
  }

  beep(freq = 800, duration = 0.08, type = "sine") {
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {
      console.warn("Audio play blocked:", e);
    }
  }

  startMetronome(bpm = 110, onTick) {
    this.init();
    this.stopMetronome();
    this.isMetronomeRunning = true;
    const intervalMs = (60 / bpm) * 1000;
    let count = 0;

    this.metronomeInterval = setInterval(() => {
      count++;
      const isHigh = count % 2 === 1;
      this.beep(isHigh ? 950 : 750, 0.06, "square");
      if (onTick) onTick(count);
    }, intervalMs);
  }

  stopMetronome() {
    if (this.metronomeInterval) {
      clearInterval(this.metronomeInterval);
      this.metronomeInterval = null;
    }
    this.isMetronomeRunning = false;
  }

  alarm() {
    this.init();
    this.beep(880, 0.15, "triangle");
    setTimeout(() => this.beep(1100, 0.2, "triangle"), 160);
    setTimeout(() => this.beep(1320, 0.3, "triangle"), 380);
  }
}

 * AnesPilot - Local Anesthetic Toxicity Index Tracker
 * Accurately tracks additive cardiotoxicity & neurotoxicity across multiple agents.
 */

const LA_AGENTS = {
  lidocaine_plain: {
    name: "Lidocaine (單方 / 無血管收縮劑)",
    defaultConcPercent: 1.0, // 1% = 10 mg/mL
    maxMgPerKg: 4.5,
    maxCeilingMg: 300,

  },

    defaultConcPercent: 1.0, // 1% = 10 mg/mL
    maxMgPerKg: 7.0,
    maxCeilingMg: 500,
    unitMgPerMl: 10
  },
  ropivacaine: {
    name: "Ropivacaine (羅哌卡因)",
    defaultConcPercent: 0.2, // 0.2% = 2 mg/mL, or 0.5% = 5 mg/mL
    maxMgPerKg: 3.0,
    maxCeilingMg: 225,
    unitMgPerMl: 2
  },
  bupivacaine_plain: {
    name: "Bupivacaine (麻佳因 / 單方)",
    defaultConcPercent: 0.5, // 0.5% = 5 mg/mL
    maxMgPerKg: 2.0,
    maxCeilingMg: 175,
    unitMgPerMl: 5
  },
  bupivacaine_epi: {
    name: "Bupivacaine + Epinephrine",
    defaultConcPercent: 0.5,
    maxMgPerKg: 2.5,
    maxCeilingMg: 225,
    unitMgPerMl: 5
  },
  levobupivacaine: {
    name: "Levobupivacaine (左旋麻佳因)",
    defaultConcPercent: 0.5,
    maxMgPerKg: 2.5,
    maxCeilingMg: 150,
    unitMgPerMl: 5
  }
};

class ToxicityEngine {
  static calculateToxicity(weightKg, administeredList, hasHighRiskFactors = false) {
    const riskFactor = hasHighRiskFactors ? 0.8 : 1.0; // 20% safety margin reduction for high-risk patients
    let totalFraction = 0;
    const breakdown = [];

    administeredList.forEach(item => {
      const agent = LA_AGENTS[item.agentId];
      if (!agent) return;

      const safeMaxMg = Math.min(agent.maxCeilingMg, agent.maxMgPerKg * weightKg) * riskFactor;
      // Calculate mg given:
      // item can have volumeMl and concPercent, or directly mg
      let mgGiven = item.mg;
      if (mgGiven == null || isNaN(mgGiven)) {
        const conc = item.concPercent || agent.defaultConcPercent;
        const mgPerMl = conc * 10;
        mgGiven = (item.volumeMl || 0) * mgPerMl;
      }

      const fraction = safeMaxMg > 0 ? (mgGiven / safeMaxMg) : 0;
      totalFraction += fraction;

      breakdown.push({
        agentId: item.agentId,
        name: agent.name,
        mgGiven: Math.round(mgGiven * 10) / 10,
        safeMaxMg: Math.round(safeMaxMg * 10) / 10,
        fractionPercent: Math.round(fraction * 1000) / 10,
        volumeMl: item.volumeMl
      });
    });

    const totalPercent = Math.round(totalFraction * 1000) / 10;
    const remainingFraction = Math.max(0, 1.0 - totalFraction);

    // Remaining capacity in commonly used agents:
    // 1) 1% Lidocaine plain (10 mg/mL)
    const lidoSafeMax = Math.min(LA_AGENTS.lidocaine_plain.maxCeilingMg, LA_AGENTS.lidocaine_plain.maxMgPerKg * weightKg) * riskFactor;
    const remainingLido1PercentMl = Math.max(0, Math.round((lidoSafeMax * remainingFraction) / 10 * 10) / 10);

    // 2) 0.2% Ropivacaine (2 mg/mL)
    const ropiSafeMax = Math.min(LA_AGENTS.ropivacaine.maxCeilingMg, LA_AGENTS.ropivacaine.maxMgPerKg * weightKg) * riskFactor;
    const remainingRopi02PercentMl = Math.max(0, Math.round((ropiSafeMax * remainingFraction) / 2 * 10) / 10);

    // 3) 0.5% Bupivacaine (5 mg/mL)
    const bupiSafeMax = Math.min(LA_AGENTS.bupivacaine_plain.maxCeilingMg, LA_AGENTS.bupivacaine_plain.maxMgPerKg * weightKg) * riskFactor;
    const remainingBupi05PercentMl = Math.max(0, Math.round((bupiSafeMax * remainingFraction) / 5 * 10) / 10);

    let status = "SAFE"; // SAFE (<70%), CAUTION (70-99%), TOXIC (>=100%)
    let statusClass = "text-emerald-400 border-emerald-500/30 bg-emerald-950/20";
    let statusText = "安全性良好 (劑量在安全許可範圍內)";

    if (totalPercent >= 100) {
      status = "TOXIC";
      statusClass = "text-rose-400 border-rose-500/50 bg-rose-950/30 animate-pulse";
      statusText = "🚨 毒性超標警戒！立即停止給藥，嚴密監測 LAST 症候！";
    } else if (totalPercent >= 70) {
      status = "CAUTION";
      statusClass = "text-amber-400 border-amber-500/40 bg-amber-950/30";
      statusText = "⚠️ 接近中毒上限警戒區 (≥ 70%)，建議減少或停止追加！";
    }

    return {
      totalPercent,
      remainingFraction,
      status,
      statusClass,
      statusText,
      breakdown,
      remainingCapacity: {
        lido1PercentMl: remainingLido1PercentMl,
        ropi02PercentMl: remainingRopi02PercentMl,
        bupi05PercentMl: remainingBupi05PercentMl
      }
    };
  }
}

class InfusionEngine {
  static doseToRate(drugId, presetIndex, targetDose, weightKg, customConcMcgMl = null) {
    const drug = INFUSION_DRUGS[drugId];
    if (!drug) return 0;
    const conc = customConcMcgMl || drug.presets[presetIndex]?.concMcgMl || 1;

    let rateMlHr = 0;
    if (drug.unit === "mcg/kg/min") {
      // Dose (mcg/kg/min) * weight (kg) * 60 min/hr / conc (mcg/mL)
      rateMlHr = (targetDose * weightKg * 60) / conc;
    } else if (drug.unit === "mcg/kg/hr") {
      // Dose (mcg/kg/hr) * weight (kg) / conc (mcg/mL)
      rateMlHr = (targetDose * weightKg) / conc;
    } else if (drug.unit === "mg/kg/hr") {
      // targetDose is mg/kg/hr -> conc is in mcg/mL (10,000 mcg/mL = 10 mg/mL)
      const concMgMl = conc / 1000;
      rateMlHr = (targetDose * weightKg) / concMgMl;
    } else if (drug.unit === "mg/hr") {
      // conc in mcg/mL -> conc in mg/mL is conc/1000
      const concMgMl = conc / 1000;
      rateMlHr = targetDose / concMgMl;
    }

    return Math.round(rateMlHr * 100) / 100;
  }

  static rateToDose(drugId, presetIndex, rateMlHr, weightKg, customConcMcgMl = null) {
    const drug = INFUSION_DRUGS[drugId];
    if (!drug) return 0;
    const conc = customConcMcgMl || drug.presets[presetIndex]?.concMcgMl || 1;

    let dose = 0;
    if (drug.unit === "mcg/kg/min") {
      // rate (mL/hr) * conc (mcg/mL) / (weight * 60)
      dose = (rateMlHr * conc) / (weightKg * 60);
    } else if (drug.unit === "mcg/kg/hr") {
      dose = (rateMlHr * conc) / weightKg;
    } else if (drug.unit === "mg/kg/hr") {
      const concMgMl = conc / 1000;
      dose = (rateMlHr * concMgMl) / weightKg;
    } else if (drug.unit === "mg/hr") {
      const concMgMl = conc / 1000;
      dose = rateMlHr * concMgMl;
    }

    return Math.round(dose * 1000) / 1000;
  }
}

  static calculateStopBang(answers) {

    const score = answers.filter(Boolean).length;
    let riskLevel = "低度風險 (Low Risk)";
    let badgeClass = "text-emerald-400 border-emerald-500/30 bg-emerald-950/30";
    let recommendation = "常規呼吸道處置，術後依照標準監測。";

    if (score >= 5 || (score >= 3 && (answers[4] || answers[6] || answers[7]))) {
      riskLevel = "高度風險 (High Risk for OSA)";
      badgeClass = "text-rose-400 border-rose-500/50 bg-rose-950/40";
      recommendation = "🚨 術中易發生難以面罩通氣/插管！拔管需清醒且完全肌鬆逆轉，術後慎用高劑量類鴉片類藥物，強烈建議持續血氧監測或 CPAP。";
    } else if (score >= 3) {
      riskLevel = "中度風險 (Intermediate Risk)";
      badgeClass = "text-amber-400 border-amber-500/40 bg-amber-950/30";
      recommendation = "⚠️ 警惕睡眠呼吸中止症，備妥合適口咽導氣管與影像喉頭鏡。";
    }

    return { score, total: 8, riskLevel, badgeClass, recommendation };
  }

  // Apfel Score for Postoperative Nausea & Vomiting (PONV)
  static calculateApfel(female, nonSmoker, historyPonvOrMotion, postopOpioids) {
    const factors = [female, nonSmoker, historyPonvOrMotion, postopOpioids];
    const score = factors.filter(Boolean).length;

    const riskPercentages = [10, 21, 39, 61, 79];
    const riskPercent = riskPercentages[score];

    let strategy = "";
    let badgeClass = "text-emerald-400 border-emerald-500/30 bg-emerald-950/30";

    if (score === 0 || score === 1) {
      strategy = "低風險（~10-21%）：一般常規處置，無需預防性併用多種止吐劑，可視情況給予單一藥物 (如 Dexamethasone 4-8 mg)。";
    } else if (score === 2) {
      badgeClass = "text-amber-400 border-amber-500/40 bg-amber-950/30";
      strategy = "中度風險（~39%）：建議給予 2 種不同機轉之止吐藥（如誘導時 Dexamethasone 4-8 mg + 關傷口時 Ondansetron 4 mg 或 Granisetron 1 mg）。";
    } else {
      badgeClass = "text-rose-400 border-rose-500/50 bg-rose-950/40";
      strategy = "高度風險（~61-79%）：強烈建議採用多模式 PONV 預防組合：\n1. 優先考慮全靜脈麻醉 (TIVA with Propofol)，避免使用吸入性氣體與 N2O。\n2. 給予 2-3 種止吐劑 (Dexamethasone + 5-HT3 antagonist + Droperidol 0.625mg)。\n3. 考慮局部神經阻滯減少術後鴉片類藥物用量，充分給予靜脈輸液。";
    }

    return { score, riskPercent, strategy, badgeClass };
  }

  // Revised Cardiac Risk Index (RCRI / Lee's Criteria)
  static calculateRcri(criteria) {
    // 6 criteria:
    // 1. High-risk surgery (intraperitoneal, intrathoracic, suprainguinal vascular)
    // 2. History of ischemic heart disease (MI, angina, CABG/PCI)
    // 3. History of congestive heart failure
    // 4. History of cerebrovascular disease (TIA, stroke)
    // 5. Preoperative insulin therapy for diabetes
    // 6. Preoperative serum creatinine > 2.0 mg/dL (177 umol/L)
    const score = criteria.filter(Boolean).length;

    let cardiacEventRisk = "3.9% (Class I)";
    let badgeClass = "text-emerald-400 border-emerald-500/30 bg-emerald-950/30";
    let recommendation = "心血管併發症風險低，常規監測。";

    if (score === 1) {
      cardiacEventRisk = "6.0% (Class II)";
      badgeClass = "text-emerald-300 border-emerald-500/30 bg-emerald-950/30";
      recommendation = "輕度心血管風險，維持術中血壓平穩，避免心搏過速與低血壓。";
    } else if (score === 2) {
      cardiacEventRisk = "10.1% (Class III)";
      badgeClass = "text-amber-400 border-amber-500/40 bg-amber-950/30";
      recommendation = "⚠️ 中度心血管風險，術中建議建立動脈導管 (A-line) 即時血壓監測，備好升壓劑。";
    } else if (score >= 3) {
      cardiacEventRisk = "15.0% 以上 (Class IV)";
      badgeClass = "text-rose-400 border-rose-500/50 bg-rose-950/40";
      recommendation = "🚨 高度心血管風險！應詳細評估心臟功能（心電圖、心臟超音波 Echo），考慮進階血行動態監測 (A-line, FloTrac, TEE)，術後安排加護病房 (ICU) 照護。";
    }

    return { score, cardiacEventRisk, recommendation, badgeClass };
  }
}

document.addEventListener("DOMContentLoaded", () => {

});

function initEventListeners() {
  // Navigation Tabs
  document.querySelectorAll(".nav-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      const target = tab.dataset.tab;
      setActiveTab(target);
    });
  });

  // Emergency Red Button (Direct to Crisis)
  const btnEmergency = document.getElementById("btn-quick-crisis");
  if (btnEmergency) {
    btnEmergency.addEventListener("click", () => setActiveTab("crisis"));
  }

  // Theme Toggle
  const btnTheme = document.getElementById("btn-theme-toggle");
  if (btnTheme) {
    btnTheme.addEventListener("click", toggleTheme);
  }

  // Patient Parameter Controls
  const weightInput = document.getElementById("input-weight");
  const weightSlider = document.getElementById("slider-weight");
  const ageInput = document.getElementById("input-age");
  const heightInput = document.getElementById("input-height");
  const genderToggle = document.getElementById("btn-gender-toggle");

  if (weightInput && weightSlider) {
    const syncWeight = (val) => {
      const num = parseFloat(val) || 1;
      state.patient.weightKg = Math.max(1, Math.min(200, num));
      weightInput.value = state.patient.weightKg;
      weightSlider.value = state.patient.weightKg;
      renderAll();
    };
    weightInput.addEventListener("input", (e) => syncWeight(e.target.value));
    weightSlider.addEventListener("input", (e) => syncWeight(e.target.value));
  }

  if (ageInput) {
    ageInput.addEventListener("input", (e) => {
      const num = parseFloat(e.target.value) || 0;
      state.patient.ageYears = Math.max(0, Math.min(110, num));
      state.patient.isPediatric = state.patient.ageYears < 12;
      renderAll();
    });
  }

  if (heightInput) {
    heightInput.addEventListener("input", (e) => {
      const num = parseFloat(e.target.value) || 0;
      state.patient.heightCm = num;
      renderAll();
    });
  }

  if (genderToggle) {
    genderToggle.addEventListener("click", () => {
      state.patient.isFemale = !state.patient.isFemale;
      genderToggle.textContent = state.patient.isFemale ? "女性 ♀" : "男性 ♂";
      genderToggle.className = state.patient.isFemale 
        ? "glove-btn bg-pink-950/60 text-pink-300 border border-pink-700/50"
        : "glove-btn bg-sky-950/60 text-sky-300 border border-sky-700/50";
      renderAll();
    });
  }

  // Quick Patient Presets
  document.querySelectorAll(".preset-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const w = parseFloat(btn.dataset.w);
      const a = parseFloat(btn.dataset.a);
      const h = parseFloat(btn.dataset.h);
      const female = btn.dataset.f === "true";

      state.patient.weightKg = w;
      state.patient.ageYears = a;
      state.patient.heightCm = h;
      state.patient.isFemale = female;
      state.patient.isPediatric = a < 12;

      if (weightInput) weightInput.value = w;
      if (weightSlider) weightSlider.value = w;
      if (ageInput) ageInput.value = a;
      if (heightInput) heightInput.value = h;
      if (genderToggle) {
        genderToggle.textContent = female ? "女性 ♀" : "男性 ♂";
      }

      renderAll();
    });
  });
}

// --- Navigation Management ---
function setActiveTab(tabId) {
  state.activeTab = tabId;
  document.querySelectorAll(".nav-tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.tab === tabId);
  });
  document.querySelectorAll(".tab-content").forEach(panel => {
    panel.classList.toggle("hidden", panel.id !== `panel-${tabId}`);
  });
  renderActiveTab();
}

// --- Theme Management ---
function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme(state.theme);
}

function applyTheme(theme) {
  const body = document.body;
  const icon = document.getElementById("theme-icon");
  if (theme === "light") {
    body.classList.add("theme-light");
    if (icon) icon.textContent = "☀️ 日照模式";
  } else {
    body.classList.remove("theme-light");
    if (icon) icon.textContent = "🌙 刀房暗室";
  }
}

// --- Master Render Coordinator ---
function renderAll() {
  renderProfilePill();
  renderActiveTab();
}

function renderProfilePill() {
  const p = state.patient;
  const dosing = DosingEngine.calculateAll(p);
  const pillWeight = document.getElementById("profile-display-weight");
  const pillAge = document.getElementById("profile-display-age");
  const pillIbw = document.getElementById("profile-display-ibw");

  if (pillWeight) pillWeight.textContent = `${p.weightKg} kg`;
  if (pillAge) {
    if (p.ageYears < 1) {
      const months = Math.round(p.ageYears * 12);
      pillAge.textContent = `${months > 0 ? months : 1} 個月大 (嬰幼兒)`;
    } else {
      pillAge.textContent = `${p.ageYears} 歲 ${p.isPediatric ? '(小兒)' : '(成人)'}`;

  if (pillIbw) {
    pillIbw.textContent = dosing.ibw ? `IBW: ${dosing.ibw} kg` : `BSA: ${dosing.bsa || '--'} m²`;
  }
}

function renderActiveTab() {
  switch (state.activeTab) {

    case "crisis":

      renderInfusionTab();
      break;

  }
}

          </button>
        ` : ''}
      </div>

      <!-- Remaining Safe Capacity -->
      ${result.totalPercent < 100 ? `
        <div class="mt-3 grid grid-cols-3 gap-2 bg-slate-900/60 p-3 rounded-lg border border-slate-800 text-center">
          <div>
            <div class="text-[11px] text-slate-400">尚可注射 1% Lidocaine</div>

window.toggleToxRisk = (checked) => {
  state.toxicityHighRisk = checked;
  renderToxicityTab();
};

window.removeToxItem = (idx) => {
  state.toxicityAdministered.splice(idx, 1);
  renderToxicityTab();
};

window.showAddToxModal = () => {
  const agentKeys = Object.keys(LA_AGENTS);
  const optionsHtml = agentKeys.map(k => `<option value="${k}">${LA_AGENTS[k].name}</option>`).join("");
  
  const vol = prompt("請輸入施打劑量體積 (mL)，例如: 20", "20");
  if (!vol) return;
  const volNum = parseFloat(vol);
  if (isNaN(volNum) || volNum <= 0) return;

  const agentId = prompt("請選擇藥物序號 (1: 1% Lidocaine, 2: 1% Lido+Epi, 3: 0.2% Ropivacaine, 4: 0.5% Bupivacaine)", "3");
  let selectedAgent = "ropivacaine";
  let conc = 0.2;
  if (agentId === "1") { selectedAgent = "lidocaine_plain"; conc = 1.0; }
  else if (agentId === "2") { selectedAgent = "lidocaine_epi"; conc = 1.0; }
  else if (agentId === "4") { selectedAgent = "bupivacaine_plain"; conc = 0.5; }

  state.toxicityAdministered.push({
    id: Date.now(),
    agentId: selectedAgent,
    concPercent: conc,
    volumeMl: volNum,
    mg: volNum * conc * 10
  });

  renderToxicityTab();
};

function renderAsraTab() {
  const container = document.getElementById("asra-container");
  if (!container) return;

  const drug = ASRA_DATABASE.find(d => d.id === state.asraSelectedDrugId) || ASRA_DATABASE[0];
  const isRenalImpaired = drug.crClThreshold && state.asraCrCl < drug.crClThreshold;
  const requiredWaitHours = isRenalImpaired ? drug.renalWarningWaitHours : drug.standardWaitHours;
  const hoursPassed = state.asraHoursSinceLastDose;
  const hoursRemaining = Math.max(0, requiredWaitHours - hoursPassed);

  let verdict = "SAFE";
  let verdictClass = "text-emerald-400 border-emerald-500/50 bg-emerald-950/40";
  let verdictText = "✅ 可安全進行神經軸阻滯穿刺 (Spinal / Epidural Safe)";

  if (requiredWaitHours === 0) {
    verdict = "SAFE";
  } else if (hoursRemaining > 0) {
    verdict = "UNSAFE";
    verdictClass = "text-rose-400 border-rose-500/50 bg-rose-950/50";
    verdictText = `❌ 距安全間隔尚差 ${hoursRemaining} 小時！嚴禁施打神經軸阻滯 (脊椎硬腦膜外血腫高危)`;

      <h3 class="font-bold text-lg text-emerald-400 mb-3 flex items-center gap-2">

        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold">選擇病患正在使用的抗凝/抗血小板藥</label>
          <select id="select-asra-drug" class="w-full glove-input text-sm" onchange="window.onAsraDrugChange(this.value)">
            ${ASRA_DATABASE.map(d => `
              <option value="${d.id}" ${d.id === state.asraSelectedDrugId ? 'selected' : ''}>
                ${d.name} (${d.category.split(' ')[0]})
              </option>
            `).join("")}
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold">最後一次服藥距今 (小時)</label>
          <input type="number" min="0" max="300" value="${state.asraHoursSinceLastDose}" class="w-full glove-input text-sm" oninput="window.onAsraHoursChange(this.value)">
          <div class="text-[11px] text-slate-500 mt-1 font-mono">約 ${(state.asraHoursSinceLastDose / 24).toFixed(1)} 天前</div>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold">腎功能 eGFR / CrCl (mL/min)</label>
          <input type="number" min="10" max="150" value="${state.asraCrCl}" class="w-full glove-input text-sm" oninput="window.onAsraCrClChange(this.value)">
          <div class="text-[11px] ${isRenalImpaired ? 'text-amber-400 font-bold' : 'text-slate-500'} mt-1">
            ${isRenalImpaired ? '⚠️ 腎功能不全，延長停藥等待時間' : '正常腎功能範圍'}
          </div>
        </div>
      </div>

      <!-- Verdict Banner -->
      <div class="p-4 rounded-xl border text-base font-black flex items-center justify-between ${verdictClass}">
        <div>${verdictText}</div>
        <div class="text-xs font-bold font-mono px-3 py-1 bg-slate-900/80 rounded border border-slate-700">
          指引建議停藥: ${requiredWaitHours} 小時
        </div>
      </div>
    </div>

    <!-- Detailed Guidelines & Catheter Recommendations -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="anes-card">
        <h4 class="font-bold text-slate-200 text-sm mb-2 flex items-center gap-1.5">
          <span>📌</span> ASRA 穿刺前停藥建議 (Pre-op Guidance)
        </h4>
        <p class="text-sm text-slate-300 leading-relaxed">${drug.recommendation}</p>
        <div class="mt-3 text-xs text-slate-400 bg-slate-900/60 p-2.5 rounded border border-slate-800">
          <span class="text-slate-300 font-bold">備註說明：</span>${drug.notes}
        </div>
      </div>

      <div class="anes-card">
        <h4 class="font-bold text-slate-200 text-sm mb-2 flex items-center gap-1.5">
          <span>🩺</span> 硬脊膜外導管拔管與術後恢復 (Catheter & Resumption)
        </h4>
        <ul class="text-xs text-slate-300 space-y-2">
          <li class="p-2 rounded bg-slate-900/60 border border-slate-800">
            <span class="font-bold text-amber-300">導管拔除前需停藥：</span>
            ${drug.catheterRemovalWaitHours > 0 ? `距離上次給藥至少 ${drug.catheterRemovalWaitHours} 小時` : '無需特殊停藥'}

          </li>
        </ul>
      </div>
    </div>
  `;
}

            `).join("")}
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold">常用醫院稀釋泡法 (Concentration Preset)</label>
          <select class="w-full glove-input text-sm" onchange="window.onInfusionPresetChange(this.value)">
            ${drug.presets.map((p, idx) => `
              <option value="${idx}" ${idx === state.infusionPresetIdx ? 'selected' : ''}>
                ${p.label}
              </option>
            `).join("")}
          </select>
        </div>
      </div>

      <!-- Target Dose Adjuster -->
      <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 mb-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-bold text-slate-200">期望給藥劑量 (${drug.unit})</span>
          <div class="flex items-center gap-2">
            <input type="number" step="0.01" min="${drug.doseMin}" max="${drug.doseMax}" value="${state.infusionTargetDose}" class="glove-input text-center w-24 py-1 text-sky-300 font-black text-lg" oninput="window.onInfusionDoseChange(this.value)">
            <span class="text-xs text-slate-400 font-mono">${drug.unit}</span>
          </div>
        </div>
        <input type="range" min="${drug.doseMin}" max="${drug.doseMax}" step="0.01" value="${state.infusionTargetDose}" class="w-full glove-slider cursor-pointer" oninput="window.onInfusionDoseChange(this.value)">
        <div class="flex justify-between text-[11px] text-slate-500 mt-1 font-mono">
          <span>最低: ${drug.doseMin}</span>
          <span>常用範圍</span>
          <span>最高: ${drug.doseMax}</span>
        </div>
      </div>

      <!-- Output Pump Rate -->
      <div class="p-4 rounded-xl bg-gradient-to-r from-sky-950/60 to-blue-950/60 border border-sky-800/60 flex items-center justify-between">
        <div>
          <div class="text-xs font-bold text-sky-300 uppercase tracking-wide">注射幫浦設定流速 (Syringe Pump Rate)</div>
          <div class="text-4xl font-black text-white mt-1">
            ${rateMlHr} <span class="text-xl text-sky-400 font-normal">mL/hr</span>
          </div>
          <div class="text-xs text-slate-400 mt-1">
            基準體重: ${state.patient.weightKg} kg &bull; 濃度: ${preset.concMcgMl} mcg/mL
          </div>
        </div>

        <div class="text-right">
          <span class="drug-badge bg-sky-900/80 text-sky-200 border border-sky-600">
            精確雙向算式
          </span>
        </div>
      </div>
    </div>
  `;
}

window.onInfusionDrugChange = (id) => {
  state.infusionDrugId = id;
  state.infusionPresetIdx = 0;
  const drug = INFUSION_DRUGS[id];
  state.infusionTargetDose = (drug.doseMin + drug.doseMax) / 4;
  renderInfusionTab();
};

window.onInfusionPresetChange = (idx) => {
  state.infusionPresetIdx = parseInt(idx, 10);
  renderInfusionTab();
};

window.onInfusionDoseChange = (val) => {
  state.infusionTargetDose = parseFloat(val) || 0.01;
  renderInfusionTab();
};

// ==========================================
// 6. PRE-OP SCORES RENDERER
// ==========================================
function renderScoresTab() {
  const container = document.getElementById("scores-container");
  if (!container) return;

  const stopBang = ScoresEngine.calculateStopBang(state.stopBangAnswers);
  const apfel = ScoresEngine.calculateApfel(state.apfelFemale, state.apfelNonSmoker, state.apfelHistory, state.apfelOpioids);
  const rcri = ScoresEngine.calculateRcri(state.rcriCriteria);

  const stopBangLabels = [
    "S - Snoring (大聲打鼾，隔著房門可聽到)",
    "T - Tired (白天容易疲累、瞌睡或嗜睡)",
    "O - Observed (睡眠中曾被目睹呼吸停止)",
    "P - Pressure (患有高血壓或服用降壓藥)",
    "B - BMI > 35 kg/m²",
    "A - Age > 50 歲",
    "N - Neck 頸圍 > 40 cm (16吋)",
    "G - Gender 男性 (Male)"
  ];

  const rcriLabels = [
    "1. 執行高風險手術 (開胸、開腹、主動脈或重大周邊血管)",
    "2. 缺血性心臟病史 (心肌梗塞、心絞痛、CABG / PCI 支架)",
    "3. 充血性心臟衰竭病史 (CHF / 肺水腫)",
    "4. 腦血管疾病病史 (中風 Stroke 或短暫性腦缺血 TIA)",
    "5. 術前正接受胰島素治療之糖尿病",
    "6. 術前抽血肌酸酐 Serum Creatinine > 2.0 mg/dL"
  ];

  container.innerHTML = `
    <!-- Apfel PONV Score -->
    <div class="anes-card mb-4 border-l-4 border-l-purple-500">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-lg text-purple-400 flex items-center gap-2">
          <span>🤢</span> Apfel 術後噁心嘔吐量表 (PONV Risk Score)
        </h3>
        <span class="text-xl font-black text-purple-300">得分: ${apfel.score} / 4</span>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
        <label class="p-2.5 rounded bg-slate-900 border border-slate-800 flex items-center gap-2 cursor-pointer">
          <input type="checkbox" ${state.apfelFemale ? 'checked' : ''} onchange="window.toggleApfel('female', this.checked)" class="w-4 h-4 accent-purple-500">
          <span class="text-xs text-slate-200">女性 (Female)</span>
        </label>
        <label class="p-2.5 rounded bg-slate-900 border border-slate-800 flex items-center gap-2 cursor-pointer">
          <input type="checkbox" ${state.apfelNonSmoker ? 'checked' : ''} onchange="window.toggleApfel('nonSmoker', this.checked)" class="w-4 h-4 accent-purple-500">
          <span class="text-xs text-slate-200">不吸菸者 (Non-smoker)</span>
        </label>
        <label class="p-2.5 rounded bg-slate-900 border border-slate-800 flex items-center gap-2 cursor-pointer">
          <input type="checkbox" ${state.apfelHistory ? 'checked' : ''} onchange="window.toggleApfel('history', this.checked)" class="w-4 h-4 accent-purple-500">
          <span class="text-xs text-slate-200">PONV 或暈車病史</span>
        </label>
        <label class="p-2.5 rounded bg-slate-900 border border-slate-800 flex items-center gap-2 cursor-pointer">
          <input type="checkbox" ${state.apfelOpioids ? 'checked' : ''} onchange="window.toggleApfel('opioids', this.checked)" class="w-4 h-4 accent-purple-500">
          <span class="text-xs text-slate-200">預期術後使用鴉片類</span>
        </label>
      </div>

      <div class="p-3 rounded-lg border ${apfel.badgeClass}">
        <div class="flex items-center justify-between mb-1">
          <span class="font-bold text-sm">術後噁心嘔吐預估發生率：約 ${apfel.riskPercent}%</span>
          <span class="text-xs font-mono font-bold uppercase">指引處置</span>
        </div>
        <div class="text-xs leading-relaxed whitespace-pre-line">${apfel.strategy}</div>
      </div>
    </div>

    <!-- STOP-Bang OSA Score -->
    <div class="anes-card mb-4 border-l-4 border-l-amber-500">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-lg text-amber-400 flex items-center gap-2">
          <span>😴</span> STOP-Bang 睡眠呼吸中止症快速篩檢
        </h3>
        <span class="text-xl font-black text-amber-300">得分: ${stopBang.score} / 8</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
        ${stopBangLabels.map((lbl, idx) => `
          <label class="p-2.5 rounded bg-slate-900 border border-slate-800 flex items-center gap-2 cursor-pointer">
            <input type="checkbox" ${state.stopBangAnswers[idx] ? 'checked' : ''} onchange="window.toggleStopBang(${idx}, this.checked)" class="w-4 h-4 accent-amber-500">
            <span class="text-xs text-slate-200">${lbl}</span>
          </label>
        `).join("")}
      </div>

      <div class="p-3 rounded-lg border ${stopBang.badgeClass}">
        <div class="font-bold text-sm mb-1">${stopBang.riskLevel}</div>
        <div class="text-xs leading-relaxed">${stopBang.recommendation}</div>
      </div>
    </div>

    <!-- RCRI Cardiac Risk -->
    <div class="anes-card border-l-4 border-l-rose-500">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-lg text-rose-400 flex items-center gap-2">
          <span>🫀</span> RCRI (Lee's Index) 心血管風險評估
        </h3>
        <span class="text-xl font-black text-rose-300">得分: ${rcri.score} / 6</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
        ${rcriLabels.map((lbl, idx) => `
          <label class="p-2.5 rounded bg-slate-900 border border-slate-800 flex items-center gap-2 cursor-pointer">
            <input type="checkbox" ${state.rcriCriteria[idx] ? 'checked' : ''} onchange="window.toggleRcri(${idx}, this.checked)" class="w-4 h-4 accent-rose-500">
            <span class="text-xs text-slate-200">${lbl}</span>
          </label>
        `).join("")}
      </div>

      <div class="p-3 rounded-lg border ${rcri.badgeClass}">
        <div class="font-bold text-sm mb-1">主要心臟不良事件 (MACE) 發生率：${rcri.cardiacEventRisk}</div>
        <div class="text-xs leading-relaxed">${rcri.recommendation}</div>
      </div>
    </div>
  `;
}

window.toggleApfel = (key, checked) => {
  if (key === 'female') state.apfelFemale = checked;
  if (key === 'nonSmoker') state.apfelNonSmoker = checked;
  if (key === 'history') state.apfelHistory = checked;
  if (key === 'opioids') state.apfelOpioids = checked;
  renderScoresTab();
};

window.toggleStopBang = (idx, checked) => {
  state.stopBangAnswers[idx] = checked;
  renderScoresTab();
};

window.toggleRcri = (idx, checked) => {
  state.rcriCriteria[idx] = checked;
  renderScoresTab();
};

// ==========================================
// 7. ANES LOGBOOK & SBAR HANDOVER RENDERER
// ==========================================
function renderLogbookTab() {
  const container = document.getElementById("logbook-container");
  if (!container) return;

  container.innerHTML = `
    <!-- Top SBAR Handover Quick Generator -->
    <div class="anes-card mb-4 border-l-4 border-l-cyan-500">
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-bold text-lg text-cyan-400 flex items-center gap-2">
          <span>🤝</span> SBAR 手術中麻醉交接班快查 (Relief Handover)
        </h3>
        <button class="glove-btn bg-cyan-600 text-white text-xs py-1.5 px-3" onclick="window.copySbarTemplate()">
          📋 複製 SBAR 交班文本
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs mt-3">
        <div class="bg-slate-900/70 p-3 rounded-lg border border-slate-800">
          <div class="font-bold text-cyan-300 mb-1">S - Situation (情境)</div>
          <div class="text-slate-400">目前術式進度、主刀醫師、預計剩餘時間、緊急狀況摘要。</div>
        </div>
        <div class="bg-slate-900/70 p-3 rounded-lg border border-slate-800">
          <div class="font-bold text-cyan-300 mb-1">B - Background (背景)</div>
          <div class="text-slate-400">年齡體重、ASA分級、過敏史、抗凝劑停藥、困難呼吸道史。</div>
        </div>
        <div class="bg-slate-900/70 p-3 rounded-lg border border-slate-800">
          <div class="font-bold text-cyan-300 mb-1">A - Assessment (評估)</div>
          <div class="text-slate-400">A-line/CVC、目前血壓心律、升壓劑劑量、失血量(EBL)、給水及尿量。</div>
        </div>
        <div class="bg-slate-900/70 p-3 rounded-lg border border-slate-800">
          <div class="font-bold text-cyan-300 mb-1">R - Recommendation (交班建議)</div>
          <div class="text-slate-400">肌鬆劑追加時間、預計拔管計畫或送 ICU、術後止痛 (PCA/Block)。</div>
        </div>
      </div>
    </div>

    <!-- Anonymous Case Logger -->
    <div class="anes-card">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-lg text-slate-200 flex items-center gap-2">
          <span>📓</span> 匿名化手術麻醉快速日誌 (Personal AnesLog)
        </h3>
        <button class="glove-btn bg-emerald-600 text-white text-xs py-1.5 px-3" onclick="window.addCaseModal()">
          + 記錄新病例
        </button>
      </div>

      <div class="space-y-2">
        ${state.cases.length === 0 ? `
          <div class="text-center py-8 text-slate-500 text-sm">尚未有任何記錄。點擊右上角新增您的第一筆麻醉病例！</div>
        ` : state.cases.map((c, idx) => `
          <div class="p-3 rounded-lg bg-slate-900/60 border border-slate-800 flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-100 text-sm">${c.procedure}</span>
                <span class="drug-badge bg-slate-800 text-cyan-300 border border-slate-700">${c.anesType}</span>
                ${c.isDifficultAirway ? '<span class="drug-badge bg-rose-950 text-rose-300 border border-rose-800">難插管</span>' : ''}
              </div>
              <div class="text-xs text-slate-400 mt-1">
                ${c.date} &bull; ${c.weight}kg &bull; 插管管徑 ${c.ettSize} &bull; 特殊處置: ${c.lines || '無'}
              </div>
              ${c.note ? `<div class="text-xs text-slate-500 mt-0.5">備註: ${c.note}</div>` : ''}
            </div>
            <button class="text-slate-500 hover:text-rose-400 text-xs p-1" onclick="window.deleteCase(${idx})">✕</button>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

window.copySbarTemplate = () => {
  const p = state.patient;
  const sbarText = `【手術室麻醉交班紀錄 SBAR】\n` +
    `S: 術式執行中，目前生命徵象穩定。\n` +
    `B: 病患 ${p.ageYears}歲, ${p.weightKg}kg, ${p.isFemale ? '女' : '男'}.\n` +
    `A: ETT管徑/深度正常，氣道通暢；已建立周邊或動脈導管監測。\n` +
    `R: 注意肌鬆維持劑量，術後評估拔管或送恢復室/加護病房。`;

  navigator.clipboard.writeText(sbarText).then(() => {
    alert("SBAR 交班文字已成功複製至剪貼簿！");
  }).catch(() => {
    prompt("請複製以下交班內容：", sbarText);
  });
};

window.addCaseModal = () => {
  const proc = prompt("請輸入手術術式名稱 (例如: Laparoscopic Cholecystectomy)", "腹腔鏡膽囊切除術");
  if (!proc) return;

  const anesType = prompt("麻醉方式 (GA-ETT / GA-LMA / Spinal / Epidural / Nerve Block)", "GA-ETT");
  const lines = prompt("管路或特殊處置 (A-line, CVC, Ultrasound block)", "A-line, PNB");
  const note = prompt("備註 (非必填)", "順利");

  const newCase = {
    id: Date.now(),
    date: new Date().toLocaleDateString(),
    procedure: proc,
    anesType: anesType || "GA-ETT",
    weight: state.patient.weightKg,
    ettSize: state.patient.isPediatric ? "4.0" : (state.patient.isFemale ? "7.0" : "7.5"),
    lines: lines || "",
    isDifficultAirway: false,
    note: note || ""
  };

  state.cases.unshift(newCase);
  localStorage.setItem("anes_cases", JSON.stringify(state.cases));
  renderLogbookTab();
};

window.deleteCase = (idx) => {
  if (confirm("確定刪除此筆病例記錄？")) {
    state.cases.splice(idx, 1);
    localStorage.setItem("anes_cases", JSON.stringify(state.cases));
    renderLogbookTab();
  }
};

</script>

        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('AnesPilot Offline Service Worker Ready:', reg.scope))
          .catch((err) => console.log('Service Worker setup note:', err));
